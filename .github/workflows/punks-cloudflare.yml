name: Punks Cloudflare CI

on:
  push:
    branches: [prod, staging]
  pull_request:

concurrency:
  group: punks-cloudflare-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  managed-workers:
    name: Managed Workers
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.4.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.14.1
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install immutable workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Bootstrap pinned Dart toolchain
        run: ./bin/dart --version
      - name: Verify Punks Workers workspace
        run: pnpm cloudflare:check
