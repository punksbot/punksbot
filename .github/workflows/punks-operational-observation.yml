name: Punks Provider-Owned Operational Observation

on:
  workflow_call:
    inputs:
      phase:
        required: true
        type: string
      source_sha:
        required: true
        type: string
      staging_deployment_id:
        required: true
        type: string
    outputs:
      manifest_sha256:
        description: Byte SHA-256 of the locked redundant v4 manifest
        value: ${{ jobs.finalize.outputs.manifest_sha256 }}

permissions:
  artifact-metadata: write
  attestations: write
  contents: read
  id-token: write

jobs:
  backend:
    if: inputs.phase == 'backend'
    name: Collect provider-owned backend proofs
    environment: punks-staging-promotion
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      STAGING_DEPLOYMENT_ID: ${{ inputs.staging_deployment_id }}
    steps:
      - name: Validate immutable provider coordinates
        id: validate
        shell: bash
        env:
          REF_PROTECTED: ${{ github.ref_protected }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$STAGING_DEPLOYMENT_ID" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "$SOURCE_SHA" = "$GITHUB_SHA"
          test "$REF_PROTECTED" = "true"

      - name: Checkout the exact provider implementation
        id: checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up pnpm
        id: setup_pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.4.0

      - name: Set up Node
        id: setup_node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.14.1
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install immutable provider dependencies
        id: install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Reobserve the exact seven-Worker staging
        id: observe_staging
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PUNKS_CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          node cloudflare/scripts/staging-deployment-proof.mjs \
            --account-id 3a391620584c792dbbd8cfa148d7634a \
            --environment staging \
            --source-sha "$SOURCE_SHA" > "$RUNNER_TEMP/provider-staging.json"
          jq -e --arg expected "$STAGING_DEPLOYMENT_ID" \
            '.deploymentId == $expected' "$RUNNER_TEMP/provider-staging.json" >/dev/null

      - name: Prove live backend authorities before destructive Session loss
        id: collect_backend
        shell: bash
        env:
          PUNKS_PROMOTION_SESSION: ${{ secrets.PUNKS_PROMOTION_SESSION }}
        run: |
          set -euo pipefail
          session_file="$RUNNER_TEMP/provider-session.json"
          cleanup() { rm -f "$session_file"; }
          trap cleanup EXIT
          node --input-type=module - "$session_file" <<'NODE'
          import { writeFileSync } from "node:fs";
          const value = process.env.PUNKS_PROMOTION_SESSION;
          if (typeof value !== "string" || value.length === 0) process.exit(1);
          writeFileSync(process.argv[2], value, { flag: "wx", mode: 0o600 });
          NODE
          unset PUNKS_PROMOTION_SESSION
          mkdir provider-backend
          node scripts/candidate/operational-backend-probe.mjs \
            --source-sha "$SOURCE_SHA" \
            --staging-deployment-id "$STAGING_DEPLOYMENT_ID" \
            --session-file "$session_file" \
            --output provider-backend/backend-probe.json
          rm -f "$session_file"
          trap - EXIT

      - name: Reobserve staging after the backend proofs
        id: reobserve_staging
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PUNKS_CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          node cloudflare/scripts/staging-deployment-proof.mjs \
            --account-id 3a391620584c792dbbd8cfa148d7634a \
            --environment staging \
            --source-sha "$SOURCE_SHA" > "$RUNNER_TEMP/provider-staging-after.json"
          cmp -s \
            "$RUNNER_TEMP/provider-staging.json" \
            "$RUNNER_TEMP/provider-staging-after.json"

      - name: Attest the exact backend probe report
        id: attest_backend
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: provider-backend/backend-probe.json

      - name: Verify the provider workflow identity
        id: verify_backend
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ATTESTATION_BUNDLE: ${{ steps.attest_backend.outputs.bundle-path }}
        run: |
          set -euo pipefail
          gh attestation verify provider-backend/backend-probe.json \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "github.com/$GITHUB_REPOSITORY/.github/workflows/punks-operational-observation.yml" \
            --source-digest "$SOURCE_SHA" \
            --source-ref "$GITHUB_REF" \
            --deny-self-hosted-runners \
            --bundle "$ATTESTATION_BUNDLE" \
            --format json > "$RUNNER_TEMP/backend-verification.json"
          test -s "$RUNNER_TEMP/backend-verification.json"
          cp "$ATTESTATION_BUNDLE" provider-backend/backend-probe.sigstore.json

      - name: Upload provider-owned backend evidence
        id: upload_backend
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: punks-operational-backend-${{ inputs.source_sha }}
          path: provider-backend
          if-no-files-found: error
          retention-days: 1

  finalize:
    if: inputs.phase == 'finalize'
    name: Attest and publish operational sources
    environment: punks-staging-promotion
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    outputs:
      manifest_sha256: ${{ steps.materialize.outputs.manifest_sha256 }}
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      STAGING_DEPLOYMENT_ID: ${{ inputs.staging_deployment_id }}
    steps:
      - name: Validate immutable provider coordinates
        id: validate
        shell: bash
        env:
          REF_PROTECTED: ${{ github.ref_protected }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$STAGING_DEPLOYMENT_ID" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "$SOURCE_SHA" = "$GITHUB_SHA"
          test "$REF_PROTECTED" = "true"

      - name: Checkout the exact provider implementation
        id: checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up pnpm
        id: setup_pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.4.0

      - name: Set up Node
        id: setup_node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.14.1
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install immutable provider dependencies
        id: install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Download all four attested platform legs
        id: download_legs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: punks-attested-leg-*-${{ inputs.source_sha }}
          path: provider-input/legs
          merge-multiple: true

      - name: Download the exact staging proof
        id: download_staging
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: punks-staging-deployment-proof-${{ inputs.source_sha }}
          path: provider-input

      - name: Download the provider-owned backend evidence
        id: download_backend
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: punks-operational-backend-${{ inputs.source_sha }}
          path: provider-input

      - name: Build and verify the exact four-platform aggregate
        id: aggregate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/candidate/artifacts.mjs aggregate \
            --input provider-input/legs \
            --output provider-candidate \
            --staging-proof provider-input/staging-deployment-proof.json \
            --source-sha "$SOURCE_SHA" \
            --staging-deployment-id "$STAGING_DEPLOYMENT_ID" \
            --repository "$GITHUB_REPOSITORY" \
            --release-tag "punks-staging-${SOURCE_SHA}" \
            --source-ref "$GITHUB_REF" \
            --signer-workflow "github.com/$GITHUB_REPOSITORY/.github/workflows/punks-desktop-candidate.yml"

      - name: Prove queues outboxes archives and R2 locks
        id: observe_infrastructure
        shell: bash
        env:
          PUNKS_OPERATOR_PROVISIONING_TOKEN: ${{ secrets.PUNKS_OPERATOR_PROVISIONING_TOKEN }}
          PUNKS_CLOUDFLARE_API_TOKEN: ${{ secrets.PUNKS_CLOUDFLARE_API_TOKEN }}
          PUNKS_R2_PRIMARY_API_TOKEN: ${{ secrets.PUNKS_R2_PRIMARY_API_TOKEN }}
          PUNKS_R2_PRIMARY_ACCESS_KEY_ID: ${{ secrets.PUNKS_R2_PRIMARY_ACCESS_KEY_ID }}
          PUNKS_R2_PRIMARY_SECRET_ACCESS_KEY: ${{ secrets.PUNKS_R2_PRIMARY_SECRET_ACCESS_KEY }}
          PUNKS_R2_RECOVERY_API_TOKEN: ${{ secrets.PUNKS_R2_RECOVERY_API_TOKEN }}
          PUNKS_R2_RECOVERY_ACCESS_KEY_ID: ${{ secrets.PUNKS_R2_RECOVERY_ACCESS_KEY_ID }}
          PUNKS_R2_RECOVERY_SECRET_ACCESS_KEY: ${{ secrets.PUNKS_R2_RECOVERY_SECRET_ACCESS_KEY }}
          PUNKS_R2_PRIMARY_DESTINATION: ${{ vars.PUNKS_R2_PRIMARY_DESTINATION }}
          PUNKS_R2_RECOVERY_DESTINATION: ${{ vars.PUNKS_R2_RECOVERY_DESTINATION }}
        run: |
          set -euo pipefail
          token_file="$RUNNER_TEMP/provider-operator-token"
          cleanup() { rm -f "$token_file"; }
          trap cleanup EXIT
          node --input-type=module - "$token_file" <<'NODE'
          import { writeFileSync } from "node:fs";
          const value = process.env.PUNKS_OPERATOR_PROVISIONING_TOKEN;
          if (typeof value !== "string" || value.length < 32) process.exit(1);
          writeFileSync(process.argv[2], value, { flag: "wx", mode: 0o600 });
          NODE
          unset PUNKS_OPERATOR_PROVISIONING_TOKEN
          node scripts/candidate/operational-infrastructure-probe.mjs \
            --source-sha "$SOURCE_SHA" \
            --staging-deployment-id "$STAGING_DEPLOYMENT_ID" \
            --operator-token-file "$token_file" \
            --r2-primary "$PUNKS_R2_PRIMARY_DESTINATION" \
            --r2-recovery "$PUNKS_R2_RECOVERY_DESTINATION" \
            --output provider-infrastructure.json
          rm -f "$token_file"
          trap - EXIT

      - name: Derive the closed provider source set
        id: collect_sources
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/candidate/operational-source-collect.mjs \
            --source-sha "$SOURCE_SHA" \
            --staging-deployment-id "$STAGING_DEPLOYMENT_ID" \
            --candidate-root provider-candidate \
            --backend-report provider-input/backend-probe.json \
            --backend-bundle provider-input/backend-probe.sigstore.json \
            --infrastructure-report provider-infrastructure.json \
            --output provider-sources

      - name: Attest all 43 provider-owned sources
        id: attest_sources
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: provider-sources/*

      - name: Verify every provider-owned source
        id: verify_sources
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ATTESTATION_BUNDLE: ${{ steps.attest_sources.outputs.bundle-path }}
        run: |
          set -euo pipefail
          test "$(find provider-sources -type f | wc -l | tr -d ' ')" = "43"
          while IFS= read -r -d '' source; do
            gh attestation verify "$source" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "github.com/$GITHUB_REPOSITORY/.github/workflows/punks-operational-observation.yml" \
              --source-digest "$SOURCE_SHA" \
              --source-ref "$GITHUB_REF" \
              --deny-self-hosted-runners \
              --bundle "$ATTESTATION_BUNDLE" \
              --format json >/dev/null
          done < <(find provider-sources -type f -print0 | sort -z)

      - name: Materialize the v4 manifest and all recomputed exports
        id: materialize
        shell: bash
        env:
          ATTESTATION_BUNDLE: ${{ steps.attest_sources.outputs.bundle-path }}
        run: |
          set -euo pipefail
          result="$(node scripts/candidate/operational-budget-materialize.mjs materialize \
            --source-sha "$SOURCE_SHA" \
            --staging-deployment-id "$STAGING_DEPLOYMENT_ID" \
            --sources provider-sources \
            --provider-bundle "$ATTESTATION_BUNDLE" \
            --output provider-material)"
          manifest_sha256="$(jq -er '.manifestSha256' <<< "$result")"
          [[ "$manifest_sha256" =~ ^[0-9a-f]{64}$ ]]
          echo "manifest_sha256=$manifest_sha256" >> "$GITHUB_OUTPUT"

      - name: Publish both locked copies with manifests last
        id: publish
        shell: bash
        env:
          PUNKS_R2_PRIMARY_API_TOKEN: ${{ secrets.PUNKS_R2_PRIMARY_API_TOKEN }}
          PUNKS_R2_PRIMARY_ACCESS_KEY_ID: ${{ secrets.PUNKS_R2_PRIMARY_ACCESS_KEY_ID }}
          PUNKS_R2_PRIMARY_SECRET_ACCESS_KEY: ${{ secrets.PUNKS_R2_PRIMARY_SECRET_ACCESS_KEY }}
          PUNKS_R2_RECOVERY_API_TOKEN: ${{ secrets.PUNKS_R2_RECOVERY_API_TOKEN }}
          PUNKS_R2_RECOVERY_ACCESS_KEY_ID: ${{ secrets.PUNKS_R2_RECOVERY_ACCESS_KEY_ID }}
          PUNKS_R2_RECOVERY_SECRET_ACCESS_KEY: ${{ secrets.PUNKS_R2_RECOVERY_SECRET_ACCESS_KEY }}
          PUNKS_R2_PRIMARY_DESTINATION: ${{ vars.PUNKS_R2_PRIMARY_DESTINATION }}
          PUNKS_R2_RECOVERY_DESTINATION: ${{ vars.PUNKS_R2_RECOVERY_DESTINATION }}
        run: |
          set -euo pipefail
          node scripts/candidate/operational-budget-materialize.mjs publish \
            --source-sha "$SOURCE_SHA" \
            --staging-deployment-id "$STAGING_DEPLOYMENT_ID" \
            --manifest-sha256 "${{ steps.materialize.outputs.manifest_sha256 }}" \
            --root provider-material \
            --r2-primaire "$PUNKS_R2_PRIMARY_DESTINATION" \
            --r2-secondaire "$PUNKS_R2_RECOVERY_DESTINATION" \
            --frontieres scripts/promotion-frontiers.mjs > provider-publication.json

      - name: Upload the exact provider material
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: punks-operational-material-${{ inputs.source_sha }}
          path: |
            provider-material/manifest.json
            provider-material/observation.json
            provider-infrastructure.json
            provider-publication.json
          if-no-files-found: error
          retention-days: 1
