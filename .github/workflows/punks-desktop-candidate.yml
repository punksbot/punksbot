name: Punks Desktop Signed Candidate

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact immutable 40-character source SHA to build
        required: true
        type: string
      staging_deployment_id:
        description: sha256 identifier from the seven-Worker staging deployment proof
        required: true
        type: string
      validation_scope:
        description: Verify only the two Apple artifacts, or build the complete four-platform candidate
        required: true
        default: apple-only
        type: choice
        options:
          - apple-only
          - full-candidate

permissions:
  contents: read

concurrency:
  group: punks-desktop-candidate-${{ inputs.source_sha }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Bind protected source
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      STAGING_DEPLOYMENT_ID: ${{ inputs.staging_deployment_id }}
      REF_PROTECTED: ${{ github.ref_protected }}
    steps:
      - name: Validate immutable dispatch inputs
        id: validate_inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$STAGING_DEPLOYMENT_ID" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "$SOURCE_SHA" = "$GITHUB_SHA"
          test "$REF_PROTECTED" = "true"

      - name: Checkout the workflow source
        id: checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Require a completely clean source checkout
        id: clean_source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

  gates:
    name: Secretless candidate gates
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      STAGING_DEPLOYMENT_ID: ${{ inputs.staging_deployment_id }}
      PUNKS_ORIGIN: https://staging.punks.bot
      PUNKS_DISTRIBUTION: staging
      VITE_PUNKS_DISTRIBUTION: punks
    steps:
      - name: Checkout the validated source
        id: checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          # The release-graph gate compares the candidate to HEAD^ to enforce
          # append-only evolution. Keep exactly one parent while still binding
          # the checkout itself to the immutable github.sha above.
          fetch-depth: 2
          persist-credentials: false

      - name: Require clean source before dependency installation
        id: clean_source
        shell: bash
        run: |
          set -euo pipefail
          test "$SOURCE_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Set up pnpm
        id: setup_pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.4.0

      - name: Set up Node
        id: setup_node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.14.1
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up the exact Dart SDK
        id: setup_dart
        uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1.7.2
        with:
          sdk: 3.10.8

      - name: Install Linux native check dependencies
        id: linux_dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libasound2-dev libayatana-appindicator3-dev \
            libgtk-3-dev librsvg2-dev libssl-dev \
            libwebkit2gtk-4.1-dev libxdo-dev pkg-config

      - name: Install immutable dependencies without lifecycle scripts
        id: install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install the exact Playwright Chromium
        id: setup_playwright
        run: pnpm --dir desktop exec playwright install chromium

      - name: Execute every secretless Punks candidate gate
        id: run_gates
        shell: bash
        run: |
          set -euo pipefail
          gate_log="$RUNNER_TEMP/punks-secretless-gates.log"
          node --input-type=module - "$gate_log" <<'NODE'
          import { writeFileSync } from "node:fs";
          writeFileSync(process.argv[2], "", { flag: "wx", mode: 0o600 });
          NODE
          mark_gate() {
            printf '::punks-gate::%s::%s\n' "$1" "$2" | tee -a "$gate_log"
          }
          mark_gate workflow-contracts start
          node --test \
            scripts/punks-desktop-candidate-workflow.test.mjs \
            scripts/punks-operational-observation-workflow.test.mjs \
            scripts/candidate/*.test.mjs 2>&1 | tee -a "$gate_log"
          mark_gate workflow-contracts pass
          mark_gate migration-check start
          pnpm migration:check 2>&1 | tee -a "$gate_log"
          mark_gate migration-check pass
          mark_gate cloudflare-check start
          pnpm cloudflare:check 2>&1 | tee -a "$gate_log"
          mark_gate cloudflare-check pass
          mark_gate workspace-check start
          pnpm --filter buzz check 2>&1 | tee -a "$gate_log"
          mark_gate workspace-check pass
          mark_gate candidate-config start
          pnpm --dir desktop check:punks-candidate 2>&1 | tee -a "$gate_log"
          mark_gate candidate-config pass
          mark_gate frontend-source start
          pnpm --dir desktop check:punks-product 2>&1 | tee -a "$gate_log"
          mark_gate frontend-source pass
          mark_gate playwright-capabilities start
          pnpm --dir desktop test:e2e:punks-capabilities 2>&1 | tee -a "$gate_log"
          mark_gate playwright-capabilities pass
          mark_gate rust-graph start
          node scripts/check-punks-rust.mjs 2>&1 | tee -a "$gate_log"
          mark_gate rust-graph pass
          mark_gate tauri-config start
          tauri_config="$(jq -c . desktop/src-tauri/tauri.punks.conf.json)"
          export TAURI_CONFIG="$tauri_config"
          node -e 'const c=JSON.parse(process.env.TAURI_CONFIG); if (!Array.isArray(c.bundle?.externalBin) || c.bundle.externalBin.length !== 0) process.exit(1)' \
            2>&1 | tee -a "$gate_log"
          mark_gate tauri-config pass
          mark_gate cargo-check start
          cargo check \
            --locked \
            --manifest-path desktop/src-tauri/Cargo.toml \
            --package desktop-shell \
            --no-default-features \
            --features punks-desktop-social-loop 2>&1 | tee -a "$gate_log"
          mark_gate cargo-check pass
          node scripts/candidate/secretless-gates-report.mjs \
            --source-sha "$SOURCE_SHA" \
            --staging-deployment-id "$STAGING_DEPLOYMENT_ID" \
            --log "$gate_log" \
            --output "$RUNNER_TEMP/punks-secretless-gates-report.json"

      - name: Upload the exact secretless gate report
        id: upload_gate_report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: punks-secretless-gates-${{ inputs.source_sha }}
          path: |
            ${{ runner.temp }}/punks-secretless-gates.log
            ${{ runner.temp }}/punks-secretless-gates-report.json
          if-no-files-found: error
          retention-days: 1

  verify_staging:
    name: Bind the exact remote staging deployment
    needs: gates
    environment: punks-staging-promotion
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      STAGING_DEPLOYMENT_ID: ${{ inputs.staging_deployment_id }}
    steps:
      - name: Checkout the validated source
        id: checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up pnpm for live staging proof
        id: setup_pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.4.0

      - name: Set up Node for live staging proof
        id: setup_node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.14.1
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install immutable live-proof dependencies
        id: install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Reobserve all seven Workers through the Cloudflare API
        id: observe_staging
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PUNKS_CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test "$SOURCE_SHA" = "$GITHUB_SHA"
          node cloudflare/scripts/staging-deployment-proof.mjs \
            --account-id 3a391620584c792dbbd8cfa148d7634a \
            --environment staging \
            --source-sha "$SOURCE_SHA" \
            > staging-deployment-proof.json
          node --input-type=module - "$SOURCE_SHA" "$STAGING_DEPLOYMENT_ID" <<'NODE'
          import { readFileSync } from "node:fs";
          import {
            CANONICAL_STAGING_ACCOUNT_ID,
            validateStagingDeploymentProof,
          } from "./cloudflare/scripts/staging-deployment-proof.mjs";
          const sourceSha = process.argv[2];
          const expectedDeploymentId = process.argv[3];
          const proof = validateStagingDeploymentProof(
            JSON.parse(readFileSync("staging-deployment-proof.json", "utf8")),
            {
              accountId: CANONICAL_STAGING_ACCOUNT_ID,
              environment: "staging",
              sourceSha,
            },
          );
          if (proof.deploymentId !== expectedDeploymentId) {
            throw new Error("remote staging deployment ID does not match dispatch input");
          }
          NODE

      - name: Prove distributed FOLLOW against the exact staging
        id: prove_live_staging_follow
        shell: bash
        env:
          PUNKS_OPERATOR_TOKEN: ${{ secrets.PUNKS_OPERATOR_PROVISIONING_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PUNKS_OPERATOR_TOKEN"
          node scripts/candidate/live-staging-follow-proof.mjs \
            --source-sha "$SOURCE_SHA" \
            --staging-deployment-id "$STAGING_DEPLOYMENT_ID" \
            --output live-staging-follow-proof.json

      - name: Prove real provider authentication against the exact Auth Worker
        id: prove_live_staging_auth
        shell: bash
        env:
          PUNKS_OPERATOR_TOKEN: ${{ secrets.PUNKS_OPERATOR_PROVISIONING_TOKEN }}
          PUNKS_LIVE_AUTH_MATRIX: ${{ secrets.PUNKS_LIVE_AUTH_MATRIX }}
        run: |
          set -euo pipefail
          test -n "$PUNKS_OPERATOR_TOKEN"
          test -n "$PUNKS_LIVE_AUTH_MATRIX"
          matrix_file="$RUNNER_TEMP/punks-live-auth-matrix.json"
          cleanup_auth_matrix() {
            rm -f "$RUNNER_TEMP/punks-live-auth-matrix.json"
          }
          trap cleanup_auth_matrix EXIT
          node --input-type=module - "$matrix_file" <<'NODE'
          import { writeFileSync } from "node:fs";
          const value = process.env.PUNKS_LIVE_AUTH_MATRIX;
          if (typeof value !== "string" || value.length === 0) process.exit(1);
          writeFileSync(process.argv[2], value, { flag: "wx", mode: 0o600 });
          NODE
          unset PUNKS_LIVE_AUTH_MATRIX
          node scripts/candidate/live-staging-auth-proof.mjs \
            --source-sha "$SOURCE_SHA" \
            --staging-deployment-id "$STAGING_DEPLOYMENT_ID" \
            --matrix "$RUNNER_TEMP/punks-live-auth-matrix.json" \
            --staging-proof staging-deployment-proof.json \
            --output live-staging-auth-proof.json
          rm -f "$RUNNER_TEMP/punks-live-auth-matrix.json"
          trap - EXIT

      - name: Upload the exact remote staging proof
        id: upload_staging_proof
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: punks-staging-deployment-proof-${{ inputs.source_sha }}
          path: |
            staging-deployment-proof.json
            live-staging-auth-proof.json
            live-staging-follow-proof.json
          if-no-files-found: error
          retention-days: 1

  observe_operational_backend:
    name: Collect provider-owned backend observations
    needs: verify_staging
    if: inputs.validation_scope == 'full-candidate'
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    uses: ./.github/workflows/punks-operational-observation.yml
    with:
      phase: backend
      source_sha: ${{ inputs.source_sha }}
      staging_deployment_id: ${{ inputs.staging_deployment_id }}
    secrets: inherit

  build:
    name: Signed platform leg (${{ matrix.platform }})
    needs: [verify_staging, observe_operational_backend]
    if: >-
      always() &&
      needs.verify_staging.result == 'success' &&
      (inputs.validation_scope == 'apple-only' ||
       needs.observe_operational_backend.result == 'success')
    environment: punks-staging-promotion
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ startsWith(matrix.platform, 'macos-') && 300 || 90 }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.validation_scope == 'apple-only' && '[{"platform":"macos-arm64","runner":"macos-15","target":"aarch64-apple-darwin","bundles":"app,dmg"},{"platform":"macos-x64","runner":"macos-15-intel","target":"x86_64-apple-darwin","bundles":"app,dmg"}]' || '[{"platform":"macos-arm64","runner":"macos-15","target":"aarch64-apple-darwin","bundles":"app,dmg"},{"platform":"macos-x64","runner":"macos-15-intel","target":"x86_64-apple-darwin","bundles":"app,dmg"},{"platform":"linux-x64","runner":"ubuntu-24.04","target":"x86_64-unknown-linux-gnu","bundles":"appimage,deb"},{"platform":"windows-x64","runner":"windows-2025","target":"x86_64-pc-windows-msvc","bundles":"nsis,msi"}]') }}
    env:
      PLATFORM: ${{ matrix.platform }}
      TARGET: ${{ matrix.target }}
      BUNDLES: ${{ matrix.bundles }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      STAGING_DEPLOYMENT_ID: ${{ inputs.staging_deployment_id }}
      PUNKS_ORIGIN: https://staging.punks.bot
      PUNKS_DISTRIBUTION: staging
      VITE_PUNKS_DISTRIBUTION: punks
      PUNKS_LINUX_GPG_KEY_ID: ${{ vars.PUNKS_LINUX_GPG_KEY_ID }}
    steps:
      - name: Checkout the validated source
        id: checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download the exact staging proof for the installed leg
        id: download_staging_proof_for_leg
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: punks-staging-deployment-proof-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/punks-staging-proof

      - name: Download the exact source-bound gate report for the installed leg
        id: download_gate_report_for_leg
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: punks-secretless-gates-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/punks-secretless-gates

      - name: Require clean source before dependency installation
        id: clean_source
        shell: bash
        run: |
          set -euo pipefail
          test "$SOURCE_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Set up pnpm
        id: setup_pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.4.0

      - name: Set up Node
        id: setup_node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.14.1
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Linux native build dependencies
        id: linux_dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl desktop-file-utils file gnupg \
            libasound2-dev libayatana-appindicator3-dev libgtk-3-dev \
            librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev \
            minisign orca patchelf pkg-config squashfs-tools \
            webkit2gtk-driver xdg-utils xvfb
          validator="$RUNNER_TEMP/validate-x86_64.AppImage"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$validator" \
            https://github.com/AppImageCommunity/AppImageUpdate/releases/download/2.0.0-alpha-1-20251018/validate-x86_64.AppImage
          printf '%s  %s\n' \
            b10c8d39a0a917432af185afc92f1cd54b7f68aa70deda927acacf38ded84990 \
            "$validator" | sha256sum --check --strict
          chmod 0755 "$validator"
          echo "validator=$validator" >> "$GITHUB_OUTPUT"

      - name: Install macOS signature verifier
        id: macos_dependencies
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          brew install cmake minisign
          cmake --version
          minisign -v

      - name: Install Windows signature verifier
        id: windows_dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          choco install minisign --yes --no-progress
          minisign -v
          $nvdaInstaller = Join-Path $env:RUNNER_TEMP "nvda_2026.1.1.exe"
          $downloadParameters = @{
            Uri = "https://download.nvaccess.org/releases/2026.1.1/nvda_2026.1.1.exe"
            OutFile = $nvdaInstaller
          }
          Invoke-WebRequest @downloadParameters
          $nvdaDigest = (Get-FileHash -Algorithm SHA256 $nvdaInstaller).Hash.ToLowerInvariant()
          if ($nvdaDigest -ne "6e0289eb5a3aa076eb97ea99c5d5465cb48b5ecc6a3257dc3d811f881a1747c9") {
            throw "NVDA installer digest mismatch"
          }
          $nvdaRoot = Join-Path $env:RUNNER_TEMP "punks-nvda-2026.1.1"
          $nvdaProcess = Start-Process -FilePath $nvdaInstaller `
            -ArgumentList @("--create-portable-silent", "--portable-path=$nvdaRoot") `
            -Wait -PassThru
          if ($nvdaProcess.ExitCode -ne 0) {
            throw "NVDA portable creation failed"
          }
          $nvda = Join-Path $nvdaRoot "nvda.exe"
          if (-not (Test-Path -LiteralPath $nvda -PathType Leaf)) {
            throw "NVDA portable binary is missing"
          }
          "nvda_binary=$nvda" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Install immutable dependencies without lifecycle scripts
        id: install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Resolve the native Edge WebDriver
        id: windows_webdriver
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $manager = Resolve-Path "node_modules/.pnpm/selenium-webdriver@4.34.0/node_modules/selenium-webdriver/bin/windows/selenium-manager.exe"
          $result = & $manager --browser edge --driver msedgedriver --output JSON | ConvertFrom-Json
          $driver = $result.result.driver_path
          if (-not (Test-Path -LiteralPath $driver -PathType Leaf)) {
            throw "Selenium Manager did not resolve msedgedriver.exe"
          }
          Split-Path -Parent $driver | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install the exact Rust target
        id: rust_target
        shell: bash
        run: |
          set -euo pipefail
          rustup show active-toolchain
          rustup target add "$TARGET"

      - name: Install the reviewed Tauri WebDriver bridge
        id: install_tauri_driver
        if: runner.os != 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          cargo install tauri-driver --version 2.0.6 --locked
          cargo install --list | grep -Fqx "tauri-driver v2.0.6:"
          tauri-driver --help | grep -F "USAGE:"

      - name: Recheck the Punks-only Tauri flavor
        id: verify_flavor
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir desktop check:punks-candidate
          pnpm --dir desktop check:punks-product
          node scripts/check-punks-rust.mjs

      - name: Prepare strict Cargo runner on Unix
        id: prepare_cargo_runner_unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          runner="$RUNNER_TEMP/punks-cargo-runner"
          umask 077
          printf '%s\n' \
            '#!/usr/bin/env bash' \
            'set -euo pipefail' \
            'exec cargo "$@" --locked --no-default-features' \
            > "$runner"
          chmod 0700 "$runner"
          echo "path=$runner" >> "$GITHUB_OUTPUT"

      - name: Prepare strict Cargo runner on Windows
        id: prepare_cargo_runner_windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $runner = Join-Path $env:RUNNER_TEMP "punks-cargo-runner.cmd"
          @(
            "@echo off",
            "cargo %* --locked --no-default-features",
            "exit /b %ERRORLEVEL%"
          ) | Set-Content -Encoding ascii $runner
          "path=$runner" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Import Apple Developer ID certificate
        id: import_apple
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.PUNKS_APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.PUNKS_APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$APPLE_CERTIFICATE"
          test -n "$APPLE_CERTIFICATE_PASSWORD"
          certificate_path="$RUNNER_TEMP/punks-certificate.p12"
          keychain_path="$RUNNER_TEMP/punks-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security list-keychain -d user -s "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain_path"
          signing_identity="$(security find-identity -v -p codesigning "$keychain_path" | awk -F '"' '$2 ~ /^Developer ID Application:/ { print $2; exit }')"
          if [[ ! "$signing_identity" =~ ^Developer\ ID\ Application:.*\ \([A-Z0-9]{10}\)$ ]]; then
            echo "::error::The Apple PKCS#12 secret does not contain one valid Developer ID Application identity. Export the certificate and its private key together from Keychain Access > My Certificates."
            exit 1
          fi
          team_id="$(printf '%s' "$signing_identity" | sed -E 's/^.*\(([A-Z0-9]{10})\)$/\1/')"
          [[ "$team_id" =~ ^[A-Z0-9]{10}$ ]]
          echo "signing_identity=$signing_identity" >> "$GITHUB_OUTPUT"
          echo "team_id=$team_id" >> "$GITHUB_OUTPUT"

      - name: Import Linux AppImage signing key
        id: import_linux
        if: runner.os == 'Linux'
        shell: bash
        env:
          LINUX_GPG_PRIVATE_KEY: ${{ secrets.PUNKS_LINUX_GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$LINUX_GPG_PRIVATE_KEY"
          printf '%s' "$LINUX_GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --batch --list-secret-keys "$PUNKS_LINUX_GPG_KEY_ID"

      - name: Build signed macOS Punks leg
        id: build_macos
        if: runner.os == 'macOS'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.PUNKS_TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.PUNKS_TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_API_ISSUER: ${{ secrets.PUNKS_APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.PUNKS_APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.PUNKS_APPLE_API_PRIVATE_KEY }}
          APPLE_SIGNING_IDENTITY: ${{ steps.import_apple.outputs.signing_identity }}
          CARGO_RUNNER: ${{ steps.prepare_cargo_runner_unix.outputs.path }}
        run: |
          set -euo pipefail
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          test -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
          test -n "$APPLE_API_ISSUER"
          test -n "$APPLE_API_KEY"
          test -n "$APPLE_API_PRIVATE_KEY"
          api_key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
          trap 'rm -f "$api_key_path"' EXIT
          env \
            -u APPLE_ID -u APPLE_PASSWORD -u APPLE_TEAM_ID \
            -u APPLE_API_ISSUER -u APPLE_API_KEY -u APPLE_API_KEY_PATH \
            -u APPLE_API_PRIVATE_KEY \
            pnpm --dir desktop tauri build \
            --runner "$CARGO_RUNNER" \
            --ci --features punks-desktop-social-loop \
            --target "$TARGET" --bundles "$BUNDLES" \
            --config src-tauri/tauri.punks.conf.json
          printf '%s' "$APPLE_API_PRIVATE_KEY" > "$api_key_path"
          unset APPLE_API_PRIVATE_KEY
          export APPLE_API_KEY_PATH="$api_key_path"
          PUNKS_NOTARY_TIMEOUT=120m scripts/macos-artifact-finalize.sh

      - name: Build signed Linux Punks leg
        id: build_linux
        if: runner.os == 'Linux'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.PUNKS_TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.PUNKS_TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPIMAGETOOL_SIGN_PASSPHRASE: ${{ secrets.PUNKS_LINUX_GPG_PASSPHRASE }}
          SIGN: "1"
          SIGN_KEY: ${{ vars.PUNKS_LINUX_GPG_KEY_ID }}
          APPIMAGETOOL_FORCE_SIGN: "1"
          CARGO_RUNNER: ${{ steps.prepare_cargo_runner_unix.outputs.path }}
        run: |
          set -euo pipefail
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          test -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
          test -n "$APPIMAGETOOL_SIGN_PASSPHRASE"
          [[ "$SIGN_KEY" =~ ^[0-9A-F]{16,40}$ ]]
          pnpm --dir desktop tauri build \
            --runner "$CARGO_RUNNER" \
            --ci --features punks-desktop-social-loop \
            --target "$TARGET" --bundles "$BUNDLES" \
            --config src-tauri/tauri.punks.conf.json

      - name: Build the Windows Punks executable before HSM signing
        id: build_windows
        if: runner.os == 'Windows'
        shell: bash
        env:
          CARGO_RUNNER: ${{ steps.prepare_cargo_runner_windows.outputs.path }}
        run: |
          set -euo pipefail
          pnpm --dir desktop tauri build \
            --runner "$CARGO_RUNNER" \
            --ci --features punks-desktop-social-loop \
            --target "$TARGET" --no-bundle \
            --config src-tauri/tauri.punks.conf.json

      - name: Exercise the Windows signer fail-closed contract
        id: test_windows_signer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & scripts/windows-artifact-sign.test.ps1
          if ($LASTEXITCODE -ne 0) {
            throw "Windows Artifact Signing behavioral contract failed"
          }

      - name: Authenticate Windows signing through GitHub OIDC
        id: azure_login
        if: runner.os == 'Windows'
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3
        with:
          client-id: ${{ secrets.PUNKS_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.PUNKS_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.PUNKS_AZURE_SUBSCRIPTION_ID }}

      - name: Sign the Windows executable with Azure Artifact Signing
        id: sign_windows_binary
        if: runner.os == 'Windows'
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.PUNKS_AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.PUNKS_AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.PUNKS_AZURE_ARTIFACT_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\desktop\src-tauri\target\${{ matrix.target }}\release\punks-bot-staging.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true

      - name: Bundle the signed Windows executable
        id: bundle_windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PUNKS_AZURE_ARTIFACT_SIGNING_ENDPOINT: ${{ vars.PUNKS_AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          PUNKS_AZURE_ARTIFACT_SIGNING_ACCOUNT: ${{ vars.PUNKS_AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          PUNKS_AZURE_ARTIFACT_SIGNING_PROFILE: ${{ vars.PUNKS_AZURE_ARTIFACT_SIGNING_PROFILE }}
          PUNKS_AZURE_ARTIFACT_SIGNING_IDENTITY_EKU: ${{ vars.PUNKS_AZURE_ARTIFACT_SIGNING_IDENTITY_EKU }}
        run: |
          $ErrorActionPreference = "Stop"
          [void](Resolve-Path "scripts/windows-artifact-sign.ps1")
          [void](Resolve-Path "desktop/src-tauri/tauri.punks.windows-signing.conf.json")
          $releaseRoot = (Resolve-Path "desktop/src-tauri/target/$env:TARGET/release").Path
          $mainBinary = (Resolve-Path "$releaseRoot/punks-bot-staging.exe").Path
          $standaloneDigestBeforeBundle = (Get-FileHash -LiteralPath $mainBinary -Algorithm SHA256).Hash.ToLowerInvariant()
          $ledgerPath = Join-Path $env:RUNNER_TEMP "punks-windows-signing-ledger.jsonl"
          if (Test-Path -LiteralPath $ledgerPath) {
            throw "Windows signing ledger already exists"
          }
          New-Item -ItemType File -Path $ledgerPath | Out-Null
          $nsisTemp = Join-Path $env:RUNNER_TEMP "punks-nsis-temp"
          if (Test-Path -LiteralPath $nsisTemp) {
            throw "Dedicated NSIS temporary directory already exists"
          }
          New-Item -ItemType Directory -Path $nsisTemp | Out-Null
          $env:PUNKS_WINDOWS_MAIN_BINARY = $mainBinary
          $env:PUNKS_WINDOWS_RELEASE_ROOT = $releaseRoot
          $env:PUNKS_WINDOWS_SIGNING_LEDGER = $ledgerPath
          $env:PUNKS_WINDOWS_NSIS_TEMP = $nsisTemp
          $env:TEMP = $nsisTemp
          $env:TMP = $nsisTemp
          pnpm --dir desktop tauri bundle --ci --features punks-desktop-social-loop --target $env:TARGET --bundles $env:BUNDLES --config src-tauri/tauri.punks.conf.json --config src-tauri/tauri.punks.windows-signing.conf.json
          if ($LASTEXITCODE -ne 0) {
            throw "Tauri Windows bundling with post-patch HSM signing failed"
          }
          $standaloneDigestAfterBundle = (Get-FileHash -LiteralPath $mainBinary -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($standaloneDigestAfterBundle -ne $standaloneDigestBeforeBundle) {
            throw "Tauri did not restore the standalone HSM-signed Windows executable"
          }
          $entries = @(
            Get-Content -LiteralPath $ledgerPath |
              Where-Object { -not [string]::IsNullOrWhiteSpace($_) } |
              ForEach-Object { $_ | ConvertFrom-Json }
          )
          if ($entries.Count -ne 12) {
            throw "Expected exactly twelve closed-role Windows signing operations"
          }
          $roleCounts = @{
            "patched-main" = 2
            "nsis-plugin" = 5
            "wix-extension" = 2
            "nsis-uninstaller" = 1
            "nsis-installer" = 1
            "msi-installer" = 1
          }
          foreach ($expected in $roleCounts.GetEnumerator()) {
            $actual = @($entries | Where-Object { $_.role -eq $expected.Key })
            if ($actual.Count -ne $expected.Value) {
              throw "Unexpected Windows signing operation count for $($expected.Key)"
            }
          }
          foreach ($entry in $entries) {
            $properties = @($entry.PSObject.Properties.Name | Sort-Object)
            if (($properties -join ",") -ne "path,role,sha256") {
              throw "Windows signing ledger entry has an unknown shape"
            }
            if ($entry.sha256 -notmatch "^[0-9a-f]{64}$") {
              throw "Windows signing ledger entry has an invalid digest"
            }
          }
          function Normalize-LedgerPath {
            param([Parameter(Mandatory = $true)][string]$Value)
            return [IO.Path]::GetFullPath($Value).ToLowerInvariant()
          }
          function Assert-ExactRolePaths {
            param(
              [Parameter(Mandatory = $true)][string]$Role,
              [Parameter(Mandatory = $true)][string[]]$ExpectedPaths
            )
            $actualPaths = @(
              $entries |
                Where-Object { $_.role -eq $Role } |
                ForEach-Object { Normalize-LedgerPath $_.path } |
                Sort-Object
            )
            $normalizedExpected = @(
              $ExpectedPaths |
                ForEach-Object { Normalize-LedgerPath $_ } |
                Sort-Object
            )
            $differences = @(
              Compare-Object -ReferenceObject $normalizedExpected -DifferenceObject $actualPaths
            )
            if (
              $actualPaths.Count -ne $normalizedExpected.Count -or
              $differences.Count -ne 0
            ) {
              throw "Windows signing ledger paths changed for role $Role"
            }
          }
          $expectedNsisPlugins = @(
            "$releaseRoot/nsis/x64/Plugins/x86-unicode/NSISdl.dll",
            "$releaseRoot/nsis/x64/Plugins/x86-unicode/StartMenu.dll",
            "$releaseRoot/nsis/x64/Plugins/x86-unicode/System.dll",
            "$releaseRoot/nsis/x64/Plugins/x86-unicode/nsDialogs.dll",
            "$releaseRoot/nsis/x64/Plugins/x86-unicode/additional/nsis_tauri_utils.dll"
          )
          $expectedWixExtensions = @(
            "$releaseRoot/wix/x64/wix/WixUIExtension.dll",
            "$releaseRoot/wix/x64/wix/WixUtilExtension.dll"
          )
          $nsis = @(Get-ChildItem "$releaseRoot/bundle/nsis" -File -Filter "*-setup.exe")
          $msi = @(Get-ChildItem "$releaseRoot/bundle/msi" -File -Filter "*.msi")
          if ($nsis.Count -ne 1 -or $msi.Count -ne 1) {
            throw "Expected one NSIS and one MSI installer for ledger validation"
          }
          Assert-ExactRolePaths "patched-main" @($mainBinary, $mainBinary)
          Assert-ExactRolePaths "nsis-plugin" $expectedNsisPlugins
          Assert-ExactRolePaths "wix-extension" $expectedWixExtensions
          Assert-ExactRolePaths "nsis-installer" @($nsis[0].FullName)
          Assert-ExactRolePaths "msi-installer" @($msi[0].FullName)
          $uninstallerEntries = @(
            $entries | Where-Object { $_.role -eq "nsis-uninstaller" }
          )
          $uninstallerPath = [IO.Path]::GetFullPath($uninstallerEntries[0].path)
          if (
            -not [IO.Path]::GetDirectoryName($uninstallerPath).Equals(
              $nsisTemp,
              [StringComparison]::OrdinalIgnoreCase
            ) -or
            [IO.Path]::GetFileName($uninstallerPath) -notmatch "^nst[0-9A-F]{4}\.tmp$"
          ) {
            throw "NSIS uninstaller ledger path escaped its exact temporary contract"
          }
          foreach ($entry in @(
            $entries |
              Where-Object {
                $_.role -in @(
                  "nsis-plugin",
                  "wix-extension",
                  "nsis-installer",
                  "msi-installer"
                )
              }
          )) {
            $item = Get-Item -LiteralPath $entry.path
            if ($item.Attributes -band [IO.FileAttributes]::ReparsePoint) {
              throw "A stable signed Windows artifact became a reparse point"
            }
            $actualDigest = (Get-FileHash -LiteralPath $item.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actualDigest -ne $entry.sha256) {
              throw "A stable signed Windows artifact changed after HSM signing"
            }
          }

      - name: Resolve the exact Windows installer allowlist
        id: prepare_windows_installers
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $bundle = "desktop/src-tauri/target/$env:TARGET/release/bundle"
          $allInstallers = @(
            Get-ChildItem $bundle -Recurse -File |
              Where-Object {
                $_.Name -like "*-setup.exe" -or $_.Extension -ieq ".msi"
              }
          )
          $nsis = @(Get-ChildItem "$bundle/nsis" -File -Filter "*-setup.exe")
          $msi = @(Get-ChildItem "$bundle/msi" -File -Filter "*.msi")
          if ($nsis.Count -ne 1 -or $msi.Count -ne 1) {
            throw "Expected exactly one NSIS and one MSI installer before signing"
          }
          $unexpectedLinks = @(
            $allInstallers |
              Where-Object {
                $_.Attributes -band [IO.FileAttributes]::ReparsePoint
              }
          )
          if ($unexpectedLinks.Count -ne 0) {
            throw "Windows installer allowlist contains a reparse point"
          }
          $expectedPaths = @($nsis[0].FullName, $msi[0].FullName)
          $actualPaths = @($allInstallers | ForEach-Object { $_.FullName })
          $differences = @(
            Compare-Object -ReferenceObject $expectedPaths -DifferenceObject $actualPaths
          )
          if ($allInstallers.Count -ne 2 -or $differences.Count -ne 0) {
            throw "Unexpected Windows installer outside the exact signing allowlist"
          }

      - name: Refresh Tauri updater signatures over signed Windows installers
        id: refresh_windows_updater
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.PUNKS_TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.PUNKS_TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw "The Tauri updater private key is required"
          }
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD)) {
            throw "The Tauri updater private key password is required"
          }
          $bundle = "desktop/src-tauri/target/$env:TARGET/release/bundle"
          $nsis = @(Get-ChildItem "$bundle/nsis" -File -Filter "*-setup.exe")
          $msi = @(Get-ChildItem "$bundle/msi" -File -Filter "*.msi")
          if ($nsis.Count -ne 1 -or $msi.Count -ne 1) {
            throw "Expected exactly one NSIS and one MSI installer"
          }
          foreach ($artifact in @($nsis[0], $msi[0])) {
            $signaturePath = "$($artifact.FullName).sig"
            Remove-Item -Force -ErrorAction SilentlyContinue $signaturePath
            pnpm --dir desktop tauri signer sign $artifact.FullName
            if ($LASTEXITCODE -ne 0 -or -not (Test-Path $signaturePath)) {
              throw "Tauri updater signature refresh failed: $($artifact.FullName)"
            }
          }

      - name: Prove the exact isolated frontend distribution
        id: verify_product_dist
        shell: bash
        run: pnpm --dir desktop check:punks-product-dist

      - name: Prove the exact isolated native executable
        id: verify_native_artifact
        shell: bash
        run: |
          set -euo pipefail
          binary="desktop/src-tauri/target/${TARGET}/release/punks-bot-staging"
          if [[ "$RUNNER_OS" = "Windows" ]]; then
            binary="${binary}.exe"
          fi
          test -f "$binary"
          node scripts/check-punks-rust.mjs --binary "$binary"

      - name: Verify exact macOS identity, timestamp and notarization
        id: verify_macos
        if: runner.os == 'macOS'
        shell: bash
        env:
          EXPECTED_IDENTITY: ${{ steps.import_apple.outputs.signing_identity }}
          EXPECTED_TEAM_ID: ${{ steps.import_apple.outputs.team_id }}
        run: |
          set -euo pipefail
          bundle="desktop/src-tauri/target/${TARGET}/release/bundle"
          test "$(find "$bundle/macos" -maxdepth 1 -name '*.app' -type d | wc -l | tr -d ' ')" = "1"
          test "$(find "$bundle/macos" -maxdepth 1 -name '*.app.tar.gz' -type f | wc -l | tr -d ' ')" = "1"
          test "$(find "$bundle/macos" -maxdepth 1 -name '*.app.tar.gz.sig' -type f | wc -l | tr -d ' ')" = "1"
          test "$(find "$bundle/dmg" -maxdepth 1 -name '*.dmg' -type f | wc -l | tr -d ' ')" = "1"
          app="$(find "$bundle/macos" -maxdepth 1 -name '*.app' -type d)"
          dmg="$(find "$bundle/dmg" -maxdepth 1 -name '*.dmg' -type f)"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign --verify --strict --verbose=2 "$dmg"
          app_details="$(codesign -dv --verbose=4 "$app" 2>&1)"
          dmg_details="$(codesign -dv --verbose=4 "$dmg" 2>&1)"
          grep -Fx "Authority=$EXPECTED_IDENTITY" <<< "$app_details"
          grep -Fx "Authority=$EXPECTED_IDENTITY" <<< "$dmg_details"
          grep -Fx "TeamIdentifier=$EXPECTED_TEAM_ID" <<< "$app_details"
          grep -Fx "TeamIdentifier=$EXPECTED_TEAM_ID" <<< "$dmg_details"
          grep -E '^Timestamp=.+' <<< "$app_details"
          grep -E '^Timestamp=.+' <<< "$dmg_details"
          spctl --assess --type execute --verbose=2 "$app"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg"
          xcrun stapler validate "$app"
          xcrun stapler validate "$dmg"
          node scripts/candidate/native-proof.mjs \
            --platform "$PLATFORM" \
            --identity "$EXPECTED_IDENTITY" \
            --team-id "$EXPECTED_TEAM_ID" \
            --timestamped true \
            --notarized true \
            --output "$RUNNER_TEMP/native-proof.json"

      - name: Verify exact Linux signatures
        id: verify_linux
        if: runner.os == 'Linux'
        shell: bash
        env:
          LINUX_GPG_PASSPHRASE: ${{ secrets.PUNKS_LINUX_GPG_PASSPHRASE }}
          APPIMAGE_VALIDATOR: ${{ steps.linux_dependencies.outputs.validator }}
        run: |
          set -euo pipefail
          bundle="desktop/src-tauri/target/${TARGET}/release/bundle"
          test "$(find "$bundle/appimage" -maxdepth 1 -name '*.AppImage' -type f | wc -l | tr -d ' ')" = "1"
          test "$(find "$bundle/appimage" -maxdepth 1 -name '*.AppImage.sig' -type f | wc -l | tr -d ' ')" = "1"
          test "$(find "$bundle/deb" -maxdepth 1 -name '*.deb' -type f | wc -l | tr -d ' ')" = "1"
          appimage="$(find "$bundle/appimage" -maxdepth 1 -name '*.AppImage' -type f)"
          deb="$(find "$bundle/deb" -maxdepth 1 -name '*.deb' -type f)"
          set +e
          validation_output="$(APPIMAGE_EXTRACT_AND_RUN=1 "$APPIMAGE_VALIDATOR" "$appimage" 2>&1)"
          validator_status=$?
          set -e
          printf '%s\n' "$validation_output"
          grep -Fx "Validation result: validation successful" <<< "$validation_output"
          grep -F "Signatures found with key fingerprints: $PUNKS_LINUX_GPG_KEY_ID" <<< "$validation_output"
          if (( validator_status != 0 && validator_status != 1 )); then
            echo "::error::AppImage validator failed with unexpected status $validator_status"
            exit "$validator_status"
          fi
          gpg --batch --yes --pinentry-mode loopback \
            --passphrase "$LINUX_GPG_PASSPHRASE" \
            --local-user "$PUNKS_LINUX_GPG_KEY_ID" \
            --armor --detach-sign "$deb"
          verification_home="$RUNNER_TEMP/punks-linux-verification"
          mkdir -m 700 "$verification_home"
          gpg --homedir "$verification_home" --batch --import \
            desktop/src-tauri/signing/punks-linux-release.asc
          gpg --homedir "$verification_home" --batch --verify "${deb}.asc" "$deb"
          node scripts/candidate/native-proof.mjs \
            --platform "$PLATFORM" \
            --identity "$PUNKS_LINUX_GPG_KEY_ID" \
            --timestamped false \
            --embedded-appimage-signature true \
            --detached-deb-signature true \
            --output "$RUNNER_TEMP/native-proof.json"

      - name: Verify exact Windows identity and timestamp
        id: verify_windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          EXPECTED_IDENTITY_EKU: ${{ vars.PUNKS_AZURE_ARTIFACT_SIGNING_IDENTITY_EKU }}
        run: |
          $ErrorActionPreference = "Stop"
          $expectedIdentityEku = $env:EXPECTED_IDENTITY_EKU
          if (
            [string]::IsNullOrWhiteSpace($expectedIdentityEku) -or
            $expectedIdentityEku -notmatch "^1\.3\.6\.1\.4\.1\.311\.97\." -or
            $expectedIdentityEku -eq "1.3.6.1.4.1.311.97.1.0"
          ) {
            throw "The exact Artifact Signing durable identity EKU is required"
          }
          $release = "desktop/src-tauri/target/$env:TARGET/release"
          $bundle = "desktop/src-tauri/target/$env:TARGET/release/bundle"
          $native = @(Get-ChildItem $release -File -Filter "punks-bot-staging.exe")
          $nsis = @(Get-ChildItem "$bundle/nsis" -File -Filter "*-setup.exe")
          $nsisSignatures = @(Get-ChildItem "$bundle/nsis" -File -Filter "*.exe.sig")
          $msi = @(Get-ChildItem "$bundle/msi" -File -Filter "*.msi")
          $msiSignatures = @(Get-ChildItem "$bundle/msi" -File -Filter "*.msi.sig")
          if ($native.Count -ne 1) {
            throw "Expected exactly one native Windows executable"
          }
          if ($nsis.Count -ne 1 -or $nsisSignatures.Count -ne 1) {
            throw "Expected exactly one signed NSIS installer and updater signature"
          }
          if ($msi.Count -ne 1 -or $msiSignatures.Count -ne 1) {
            throw "Expected exactly one signed MSI installer and updater signature"
          }
          $nsisInstall = Join-Path $env:RUNNER_TEMP "punks-nsis-install"
          $msiInstall = Join-Path $env:RUNNER_TEMP "punks-msi-install"
          New-Item -ItemType Directory -Path $nsisInstall, $msiInstall | Out-Null
          $nsisProcess = Start-Process -FilePath $nsis[0].FullName -ArgumentList @(
            "/S",
            "/D=$nsisInstall"
          ) -Wait -PassThru
          if ($nsisProcess.ExitCode -ne 0) {
            throw "NSIS installed-artifact verification setup failed"
          }
          $nsisInstalled = @(
            Get-ChildItem $nsisInstall -Recurse -File -Filter "punks-bot-staging.exe"
          )
          $nsisUninstallers = @(
            Get-ChildItem $nsisInstall -Recurse -File -Filter "uninstall.exe"
          )
          if ($nsisInstalled.Count -ne 1 -or $nsisUninstallers.Count -ne 1) {
            throw "Expected one NSIS-installed executable and uninstaller"
          }
          $msiArguments = "/a `"$($msi[0].FullName)`" /qn TARGETDIR=`"$msiInstall`""
          $msiProcess = Start-Process -FilePath msiexec.exe -ArgumentList $msiArguments -Wait -PassThru
          if ($msiProcess.ExitCode -ne 0) {
            throw "MSI installed-artifact verification setup failed"
          }
          $msiInstalled = @(
            Get-ChildItem $msiInstall -Recurse -File -Filter "punks-bot-staging.exe"
          )
          if ($msiInstalled.Count -ne 1) {
            throw "Expected one MSI-installed executable"
          }
          $ledgerPath = Join-Path $env:RUNNER_TEMP "punks-windows-signing-ledger.jsonl"
          $patchedDigests = @(
            Get-Content -LiteralPath $ledgerPath |
              Where-Object { -not [string]::IsNullOrWhiteSpace($_) } |
              ForEach-Object { $_ | ConvertFrom-Json } |
              Where-Object { $_.role -eq "patched-main" } |
              ForEach-Object { $_.sha256 } |
              Sort-Object
          )
          $installedDigests = @(
            @($nsisInstalled[0], $msiInstalled[0]) |
              ForEach-Object {
                (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              } |
              Sort-Object
          )
          if (
            $patchedDigests.Count -ne 2 -or
            $installedDigests.Count -ne 2 -or
            ($patchedDigests -join ",") -ne ($installedDigests -join ",")
          ) {
            throw "Installed NSIS/MSI executables do not match the two HSM-signed patched variants"
          }
          $toolDllPaths = @(
            "$release/nsis/x64/Plugins/x86-unicode/NSISdl.dll",
            "$release/nsis/x64/Plugins/x86-unicode/StartMenu.dll",
            "$release/nsis/x64/Plugins/x86-unicode/System.dll",
            "$release/nsis/x64/Plugins/x86-unicode/nsDialogs.dll",
            "$release/nsis/x64/Plugins/x86-unicode/additional/nsis_tauri_utils.dll",
            "$release/wix/x64/wix/WixUIExtension.dll",
            "$release/wix/x64/wix/WixUtilExtension.dll"
          )
          $toolDlls = @(
            $toolDllPaths | ForEach-Object { Get-Item -LiteralPath $_ }
          )
          if ($toolDlls.Count -ne 7) {
            throw "Expected exactly seven Tauri tool DLLs in the signing proof"
          }
          $nativeThumbprint = $null
          $signedArtifacts = @(
            $native[0],
            $nsis[0],
            $msi[0],
            $nsisInstalled[0],
            $nsisUninstallers[0],
            $msiInstalled[0]
          ) + $toolDlls
          if ($signedArtifacts.Count -ne 13) {
            throw "Expected exactly thirteen Windows Authenticode proof targets"
          }
          foreach ($artifact in $signedArtifacts) {
            $signature = Get-AuthenticodeSignature $artifact.FullName
            if ($signature.Status -ne "Valid") {
              throw "Invalid Authenticode signature: $($artifact.FullName)"
            }
            $ekuExtensions = @(
              $signature.SignerCertificate.Extensions |
                Where-Object { $_.Oid.Value -eq "2.5.29.37" }
            )
            if ($ekuExtensions.Count -ne 1) {
              throw "Signer has no unique extended key usage extension: $($artifact.FullName)"
            }
            $eku = [System.Security.Cryptography.X509Certificates.X509EnhancedKeyUsageExtension]$ekuExtensions[0]
            $ekuOids = @($eku.EnhancedKeyUsages | ForEach-Object { $_.Value })
            foreach ($requiredEku in @(
              "1.3.6.1.5.5.7.3.3",
              "1.3.6.1.4.1.311.97.1.0",
              $expectedIdentityEku
            )) {
              if ($ekuOids -notcontains $requiredEku) {
                throw "Signer lacks required EKU $requiredEku`: $($artifact.FullName)"
              }
            }
            if ($null -eq $signature.TimeStamperCertificate) {
              throw "Missing Authenticode timestamp: $($artifact.FullName)"
            }
            if ($artifact.FullName -eq $native[0].FullName) {
              $nativeThumbprint = $signature.SignerCertificate.Thumbprint.ToUpperInvariant()
            }
          }
          node scripts/candidate/native-proof.mjs --platform "$env:PLATFORM" --identity "$expectedIdentityEku" --thumbprint "$nativeThumbprint" --timestamped true --output (Join-Path $env:RUNNER_TEMP "native-proof.json")
          if ($LASTEXITCODE -ne 0) { throw "Native proof generation failed" }

      - name: Verify every Tauri updater signature
        id: verify_updater
        shell: bash
        run: |
          set -euo pipefail
          bundle="desktop/src-tauri/target/${TARGET}/release/bundle"
          encoded_key="$(node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const config = JSON.parse(readFileSync("desktop/src-tauri/tauri.punks.conf.json", "utf8"));
            process.stdout.write(config.plugins.updater.pubkey);
          ')"
          public_key="$(printf '%s' "$encoded_key" | base64 --decode | tail -n 1)"
          decoded_signature="$RUNNER_TEMP/punks-tauri-updater.minisig"
          trap 'rm -f -- "$decoded_signature"' EXIT
          verify_tauri_signature() {
            local artifact="$1"
            local encoded_signature="${artifact}.sig"
            [[ -f "$encoded_signature" && ! -L "$encoded_signature" ]]
            base64 --decode < "$encoded_signature" > "$decoded_signature"
            [[ -s "$decoded_signature" && ! -L "$decoded_signature" ]]
            minisign -Vm "$artifact" -x "$decoded_signature" -P "$public_key"
            rm -f -- "$decoded_signature"
          }
          case "$PLATFORM" in
            macos-*)
              updater="$(find "$bundle/macos" -maxdepth 1 -name '*.app.tar.gz' -type f)"
              verify_tauri_signature "$updater"
              ;;
            linux-x64)
              updater="$(find "$bundle/appimage" -maxdepth 1 -name '*.AppImage' -type f)"
              verify_tauri_signature "$updater"
              ;;
            windows-x64)
              nsis="$(find "$bundle/nsis" -maxdepth 1 -name '*.exe' -type f)"
              msi="$(find "$bundle/msi" -maxdepth 1 -name '*.msi' -type f)"
              verify_tauri_signature "$nsis"
              verify_tauri_signature "$msi"
              ;;
            *)
              echo "Unsupported platform: $PLATFORM" >&2
              exit 1
              ;;
          esac

      - name: Exercise the installed social loop and seal its evidence
        id: exercise_installed_candidate
        if: inputs.validation_scope == 'full-candidate'
        shell: bash
        env:
          PUNKS_PROMOTION_SESSION: ${{ secrets.PUNKS_PROMOTION_SESSION }}
          PUNKS_OPERATOR_PROVISIONING_TOKEN: ${{ secrets.PUNKS_OPERATOR_PROVISIONING_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PUNKS_PROMOTION_SESSION"
          test -n "$PUNKS_OPERATOR_PROVISIONING_TOKEN"
          staging_proof="$RUNNER_TEMP/punks-staging-proof/staging-deployment-proof.json"
          live_auth_proof="$RUNNER_TEMP/punks-staging-proof/live-staging-auth-proof.json"
          live_follow_proof="$RUNNER_TEMP/punks-staging-proof/live-staging-follow-proof.json"
          test -f "$staging_proof"
          test -f "$live_auth_proof"
          test -f "$live_follow_proof"
          cargo build \
            --locked \
            --release \
            --target "$TARGET" \
            --manifest-path desktop/src-tauri/Cargo.toml \
            --package punks-promotion-session
          helper="desktop/src-tauri/target/$TARGET/release/punks-promotion-session"
          if [[ "$PLATFORM" == "windows-x64" ]]; then helper="${helper}.exe"; fi
          session_bundle="$RUNNER_TEMP/punks-promotion-session.json"
          operator_token_file="$RUNNER_TEMP/punks-operator-token"
          manual_review_file="$RUNNER_TEMP/punks-manual-accessibility-review.json"
          remove_secret_files() {
            node --input-type=module - "$session_bundle" "$operator_token_file" "$manual_review_file" <<'NODE'
          import { rmSync } from "node:fs";
          for (const path of process.argv.slice(2)) rmSync(path, { force: true });
          NODE
          }
          cleanup_session() {
            local main_status=$?
            trap - EXIT
            local cleanup_status=0
            "$helper" --destroy || cleanup_status=$?
            remove_secret_files || cleanup_status=$?
            if [[ "$main_status" -ne 0 ]]; then
              exit "$main_status"
            fi
            exit "$cleanup_status"
          }
          trap cleanup_session EXIT
          node --input-type=module - "$session_bundle" "$operator_token_file" <<'NODE'
          import { writeFileSync } from "node:fs";
          const materials = [
            [process.argv[2], process.env.PUNKS_PROMOTION_SESSION],
            [process.argv[3], process.env.PUNKS_OPERATOR_PROVISIONING_TOKEN],
          ];
          for (const [path, value] of materials) {
            if (typeof value !== "string" || value.length === 0) process.exit(1);
            writeFileSync(path, value, { flag: "wx", mode: 0o600 });
          }
          NODE
          unset PUNKS_PROMOTION_SESSION PUNKS_OPERATOR_PROVISIONING_TOKEN
          "$helper" --source-sha "$SOURCE_SHA" < "$session_bundle"
          staging_fixture="$RUNNER_TEMP/punks-staging-fixture.json"
          node scripts/candidate/staging-fixture.mjs \
            --source-sha "$SOURCE_SHA" \
            --origin "https://staging.punks.bot" \
            --session-file "$session_bundle" \
            --operator-token-file "$operator_token_file" \
            --output "$staging_fixture"
          node --input-type=module - "$session_bundle" <<'NODE'
          import { rmSync } from "node:fs";
          rmSync(process.argv[2], { force: true });
          NODE
          test ! -e "$session_bundle"

          bundle="desktop/src-tauri/target/$TARGET/release/bundle"
          case "$PLATFORM" in
            macos-*)
              installed_source="$(find "$bundle/macos" -maxdepth 1 -type f -name '*.app.tar.gz')"
              signature_source="${installed_source}.sig"
              suffix='.app.tar.gz'
              ;;
            linux-x64)
              installed_source="$(find "$bundle/appimage" -maxdepth 1 -type f -name '*.AppImage')"
              signature_source="${installed_source}.sig"
              suffix='.AppImage'
              ;;
            windows-x64)
              installed_source="$(find "$bundle/nsis" -maxdepth 1 -type f -name '*.exe')"
              signature_source="${installed_source}.sig"
              suffix='.exe'
              ;;
            *)
              echo "Unsupported platform: $PLATFORM" >&2
              exit 1
              ;;
          esac
          installed_artifact="$RUNNER_TEMP/punks-desktop-${PLATFORM}-${SOURCE_SHA}${suffix}"
          updater_signature="${installed_artifact}.sig"
          cp "$installed_source" "$installed_artifact"
          cp "$signature_source" "$updater_signature"
          fault_observation="$RUNNER_TEMP/punks-fault-observation-${PLATFORM}.json"
          raw_evidence="$RUNNER_TEMP/punks-raw-evidence-${PLATFORM}"
          case "$PLATFORM" in
            macos-*)
              installed_root="$RUNNER_TEMP/punks-macos-install-${PLATFORM}"
              mkdir "$installed_root"
              tar -xzf "$installed_artifact" -C "$installed_root"
              native_binary="$(find "$installed_root" -type f -path '*/Contents/MacOS/punks-bot-staging')"
              test "$(find "$installed_root" -type f -path '*/Contents/MacOS/punks-bot-staging' | wc -l | tr -d ' ')" = "1"
              ;;
            linux-x64)
              extract_root="$RUNNER_TEMP/punks-appimage-install-${PLATFORM}"
              mkdir "$extract_root"
              chmod +x "$installed_artifact"
              (cd "$extract_root" && "$installed_artifact" --appimage-extract >/dev/null)
              installed_root="$extract_root/squashfs-root"
              native_binary="$(find "$installed_root" -type f -name 'punks-bot-staging')"
              test "$(find "$installed_root" -type f -name 'punks-bot-staging' | wc -l | tr -d ' ')" = "1"
              ;;
            windows-x64)
              installed_root="$RUNNER_TEMP/punks-nsis-install"
              native_binary="$(find "$installed_root" -type f -name 'punks-bot-staging.exe')"
              test "$(find "$installed_root" -type f -name 'punks-bot-staging.exe' | wc -l | tr -d ' ')" = "1"
              ;;
            *) echo "Unsupported platform: $PLATFORM" >&2; exit 1 ;;
          esac
          test -f "$native_binary"
          case "$PLATFORM" in
            macos-*)
              screen_reader_binary="/System/Library/CoreServices/VoiceOver.app/Contents/MacOS/VoiceOver"
              ;;
            linux-x64)
              screen_reader_binary="$(command -v orca)"
              ;;
            windows-x64)
              screen_reader_binary="${{ steps.windows_dependencies.outputs.nvda_binary }}"
              ;;
            *) echo "Unsupported platform: $PLATFORM" >&2; exit 1 ;;
          esac
          network_log="$raw_evidence/network.jsonl"
          driver_transcript="$RUNNER_TEMP/punks-transcript-${PLATFORM}.json"
          resilience_observation="$RUNNER_TEMP/punks-resilience-${PLATFORM}.json"
          driver_command=(node)
          if [[ "$PLATFORM" == "linux-x64" ]]; then
            driver_command=(xvfb-run --auto-servernum node)
          fi
          "${driver_command[@]}" scripts/candidate/exercise-installed-social-loop.mjs \
              --platform "$PLATFORM" \
              --source-sha "$SOURCE_SHA" \
              --staging-deployment-proof "$staging_proof" \
              --live-auth-proof "$live_auth_proof" \
              --live-follow-proof "$live_follow_proof" \
              --staging-fixture "$staging_fixture" \
              --bundle "$bundle" \
              --installed-root "$installed_root" \
              --installed-artifact "$installed_artifact" \
              --native-binary "$native_binary" \
              --native-proof "$RUNNER_TEMP/native-proof.json" \
              --fault-observation "$fault_observation" \
              --operator-token-file "$operator_token_file" \
              --manual-review-file "$manual_review_file" \
              --gate-report "$RUNNER_TEMP/punks-secretless-gates/punks-secretless-gates-report.json" \
              --gate-log "$RUNNER_TEMP/punks-secretless-gates/punks-secretless-gates.log" \
              --screen-reader-binary "$screen_reader_binary" \
              --network-log "$network_log" \
              --output "$driver_transcript" \
              --resilience-output "$resilience_observation" \
              --raw-evidence-output "$raw_evidence"
          remove_secret_files

      - name: Upload source-bound material for independent accessibility review
        id: upload_accessibility_review_material
        if: failure() && inputs.validation_scope == 'full-candidate'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: punks-accessibility-review-${{ matrix.platform }}-${{ inputs.source_sha }}
          path: |
            ${{ runner.temp }}/punks-raw-evidence-${{ matrix.platform }}
            ${{ runner.temp }}/punks-desktop-${{ matrix.platform }}-*
          if-no-files-found: error
          retention-days: 7

      - name: Scan the exact updater inputs after the installed run
        id: scan_installed_candidate
        if: inputs.validation_scope == 'full-candidate'
        shell: bash
        run: |
          set -euo pipefail
          case "$PLATFORM" in
            macos-*)
              suffix='.app.tar.gz'
              installed_root="$RUNNER_TEMP/punks-macos-install-${PLATFORM}"
              native_binary="$(find "$installed_root" -type f -path '*/Contents/MacOS/punks-bot-staging')"
              ;;
            linux-x64)
              suffix='.AppImage'
              installed_root="$RUNNER_TEMP/punks-appimage-install-${PLATFORM}/squashfs-root"
              native_binary="$(find "$installed_root" -type f -name 'punks-bot-staging')"
              ;;
            windows-x64)
              suffix='.exe'
              installed_root="$RUNNER_TEMP/punks-nsis-install"
              native_binary="$(find "$installed_root" -type f -name 'punks-bot-staging.exe')"
              ;;
            *) echo "Unsupported platform: $PLATFORM" >&2; exit 1 ;;
          esac
          installed_artifact="$RUNNER_TEMP/punks-desktop-${PLATFORM}-${SOURCE_SHA}${suffix}"
          test -f "$native_binary"
          node scripts/candidate/installed-artifact-scan.mjs \
            --platform "$PLATFORM" \
            --source-sha "$SOURCE_SHA" \
            --native-binary "$native_binary" \
            --installed-artifact "$installed_artifact" \
            --installed-root "$installed_root" \
            --embedded-assets "$RUNNER_TEMP/punks-raw-evidence-${PLATFORM}/embedded-assets.json" \
            --output "$RUNNER_TEMP/punks-artifact-scan-${PLATFORM}.json"

      - name: Reobserve staging and seal the installed evidence
        id: seal_installed_candidate
        if: inputs.validation_scope == 'full-candidate'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PUNKS_CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          case "$PLATFORM" in
            macos-*) suffix='.app.tar.gz' ;;
            linux-x64) suffix='.AppImage' ;;
            windows-x64) suffix='.exe' ;;
            *) echo "Unsupported platform: $PLATFORM" >&2; exit 1 ;;
          esac
          installed_artifact="$RUNNER_TEMP/punks-desktop-${PLATFORM}-${SOURCE_SHA}${suffix}"
          updater_signature="${installed_artifact}.sig"
          raw_evidence="$RUNNER_TEMP/punks-raw-evidence-${PLATFORM}"
          driver_transcript="$RUNNER_TEMP/punks-transcript-${PLATFORM}.json"
          resilience_observation="$RUNNER_TEMP/punks-resilience-${PLATFORM}.json"
          artifact_scan="$RUNNER_TEMP/punks-artifact-scan-${PLATFORM}.json"
          test -f "$installed_artifact"
          test -f "$updater_signature"
          test -f "$driver_transcript"
          test -f "$resilience_observation"
          test -f "$artifact_scan"
          staging_proof="$RUNNER_TEMP/punks-staging-proof/staging-deployment-proof.json"
          test -f "$staging_proof"
          node scripts/candidate/installed-app.mjs \
            --platform "$PLATFORM" \
            --source-sha "$SOURCE_SHA" \
            --staging-deployment-proof "$staging_proof" \
            --installed-artifact "$installed_artifact" \
            --updater-signature "$updater_signature" \
            --driver-transcript "$driver_transcript" \
            --resilience-observation "$resilience_observation" \
            --artifact-scan "$artifact_scan" \
            --raw-evidence "$raw_evidence" \
            --proof-output "$RUNNER_TEMP/punks-installed-proof-${PLATFORM}" \
            --network-output "$RUNNER_TEMP/punks-installed-proof-${PLATFORM}/network-proof.json"

      - name: Stage one closed platform leg
        id: stage_leg
        if: inputs.validation_scope == 'full-candidate'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/candidate/artifacts.mjs collect \
            --platform "$PLATFORM" \
            --target "$TARGET" \
            --source-sha "$SOURCE_SHA" \
            --staging-deployment-id "$STAGING_DEPLOYMENT_ID" \
            --bundle "desktop/src-tauri/target/${TARGET}/release/bundle" \
            --native-proof "$RUNNER_TEMP/native-proof.json" \
            --installed-proof "$RUNNER_TEMP/punks-installed-proof-${PLATFORM}" \
            --network-proof "$RUNNER_TEMP/punks-installed-proof-${PLATFORM}/network-proof.json" \
            --output candidate-leg

      - name: Upload intermediate platform leg
        id: upload_leg
        if: inputs.validation_scope == 'full-candidate'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: punks-candidate-leg-${{ matrix.platform }}-${{ inputs.source_sha }}
          path: candidate-leg
          if-no-files-found: error
          retention-days: 1

  attest_legs:
    name: Attest and verify platform leg (${{ matrix.platform }})
    needs: build
    if: inputs.validation_scope == 'full-candidate'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      artifact-metadata: write
      contents: read
      attestations: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-arm64, macos-x64, linux-x64, windows-x64]
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      PLATFORM: ${{ matrix.platform }}
    steps:
      - name: Download exact intermediate platform leg
        id: download_leg
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: punks-candidate-leg-${{ matrix.platform }}-${{ inputs.source_sha }}
          path: candidate-leg

      - name: Attest platform leg provenance
        id: attest_leg
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: candidate-leg/**/*

      - name: Verify the platform attestation and source identity
        id: verify_leg_attestation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ATTESTATION_BUNDLE: ${{ steps.attest_leg.outputs.bundle-path }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/leg-verification"
          while IFS= read -r -d '' artifact; do
            output="$RUNNER_TEMP/leg-verification/$(printf '%s' "$artifact" | sha256sum | cut -d ' ' -f 1).json"
            gh attestation verify "$artifact" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "github.com/$GITHUB_REPOSITORY/.github/workflows/punks-desktop-candidate.yml" \
              --source-digest "$SOURCE_SHA" \
              --source-ref "$GITHUB_REF" \
              --deny-self-hosted-runners \
              --bundle "$ATTESTATION_BUNDLE" \
              --format json > "$output"
            test -s "$output"
          done < <(find candidate-leg -type f -print0 | sort -z)
          cp "$ATTESTATION_BUNDLE" "candidate-leg/${PLATFORM}/provenance.sigstore.json"

      - name: Upload verified attested platform leg
        id: upload_attested_leg
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: punks-attested-leg-${{ matrix.platform }}-${{ inputs.source_sha }}
          path: candidate-leg
          if-no-files-found: error
          retention-days: 1

  observe_operational:
    name: Publish provider-owned operational observations
    needs: attest_legs
    if: inputs.validation_scope == 'full-candidate'
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    uses: ./.github/workflows/punks-operational-observation.yml
    with:
      phase: finalize
      source_sha: ${{ inputs.source_sha }}
      staging_deployment_id: ${{ inputs.staging_deployment_id }}
    secrets: inherit

  aggregate:
    name: Aggregate four verified legs
    needs: [attest_legs, observe_operational]
    if: inputs.validation_scope == 'full-candidate'
    environment: punks-staging-promotion
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      artifact-metadata: write
      contents: read
      attestations: write
      id-token: write
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      STAGING_DEPLOYMENT_ID: ${{ inputs.staging_deployment_id }}
    steps:
      - name: Checkout candidate aggregation code
        id: checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download all four attested platform legs
        id: download_attested_legs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: punks-attested-leg-*-${{ inputs.source_sha }}
          path: candidate-input/legs
          merge-multiple: true

      - name: Download the protected remote staging proof
        id: download_staging_proof
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: punks-staging-deployment-proof-${{ inputs.source_sha }}
          path: candidate-input/staging

      - name: Download the exact secretless gate report
        id: download_gate_report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: punks-secretless-gates-${{ inputs.source_sha }}
          path: candidate-input/gates

      - name: Build closed aggregate and immutable staging latest.json
        id: aggregate_candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/candidate/artifacts.mjs aggregate \
            --input candidate-input/legs \
            --output candidate \
            --staging-proof candidate-input/staging/staging-deployment-proof.json \
            --source-sha "$SOURCE_SHA" \
            --staging-deployment-id "$STAGING_DEPLOYMENT_ID" \
            --repository "$GITHUB_REPOSITORY" \
            --release-tag "punks-staging-${SOURCE_SHA}" \
            --source-ref "$GITHUB_REF" \
            --signer-workflow "github.com/$GITHUB_REPOSITORY/.github/workflows/punks-desktop-candidate.yml"
          cp candidate-input/staging/live-staging-follow-proof.json \
            candidate/live-staging-follow-proof.json
          cp candidate-input/staging/live-staging-auth-proof.json \
            candidate/live-staging-auth-proof.json

      - name: Attest the exact production aggregate
        id: attest_production_candidate
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            candidate/release-assets/*
            candidate/aggregate-manifest.json
            candidate/staging-deployment-proof.json
            candidate/live-staging-auth-proof.json
            candidate/live-staging-follow-proof.json
            candidate/promotion-evidence/**/*

      - name: Verify the production aggregate provenance
        id: verify_production_candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ATTESTATION_BUNDLE: ${{ steps.attest_production_candidate.outputs.bundle-path }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/production-verification"
          while IFS= read -r -d '' subject; do
            output="$RUNNER_TEMP/production-verification/$(printf '%s' "$subject" | sha256sum | cut -d ' ' -f 1).json"
            gh attestation verify "$subject" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "github.com/$GITHUB_REPOSITORY/.github/workflows/punks-desktop-candidate.yml" \
              --source-digest "$SOURCE_SHA" \
              --source-ref "$GITHUB_REF" \
              --deny-self-hosted-runners \
              --bundle "$ATTESTATION_BUNDLE" \
              --format json > "$output"
            test -s "$output"
          done < <(find candidate/release-assets candidate/promotion-evidence \
            -type f -print0; printf '%s\0' candidate/aggregate-manifest.json candidate/staging-deployment-proof.json candidate/live-staging-auth-proof.json candidate/live-staging-follow-proof.json)
          cp "$ATTESTATION_BUNDLE" candidate/promotion-evidence/production-aggregate-provenance.sigstore.json

      - name: Build gate and withdrawal fragments from observed subjects
        id: build_observed_evidence_fragments
        shell: bash
        run: |
          set -euo pipefail
          node scripts/candidate/observed-evidence-fragments.mjs \
            --candidate candidate \
            --source-sha "$SOURCE_SHA" \
            --staging-deployment-id "$STAGING_DEPLOYMENT_ID" \
            --gate-report candidate-input/gates/punks-secretless-gates-report.json \
            --gate-log candidate-input/gates/punks-secretless-gates.log \
            --promotion-profile cloudflare/promotion-profiles.json \
            --staging-material cloudflare/staging.resources.json \
            --release-graph docs/migration/release-graph.yaml \
            --withdrawal-inventory docs/migration/withdrawal-inventory.yaml \
            --goldens docs/migration/goldens-ledger.yaml \
            --provenance-bundle candidate/promotion-evidence/production-aggregate-provenance.sigstore.json

      - name: Complete the content-addressed promotion evidence
        id: complete_promotion_evidence
        shell: bash
        run: |
          set -euo pipefail
          node scripts/candidate/complete-promotion-evidence.mjs \
            --candidate candidate \
            --source-sha "$SOURCE_SHA" \
            --staging-deployment-id "$STAGING_DEPLOYMENT_ID" \
            --promotion-profile cloudflare/promotion-profiles.json \
            --staging-material cloudflare/staging.resources.json \
            --release-graph docs/migration/release-graph.yaml \
            --withdrawal-inventory docs/migration/withdrawal-inventory.yaml \
            --goldens docs/migration/goldens-ledger.yaml \
            --provenance-bundle candidate/promotion-evidence/production-aggregate-provenance.sigstore.json \
            --output candidate/promotion-evidence/index.json

      - name: Stage locked redundant operational budget sources
        id: stage_operational_budgets
        shell: bash
        env:
          PUNKS_OPERATIONAL_BUDGET_MANIFEST_SHA256: ${{ needs.observe_operational.outputs.manifest_sha256 }}
          PUNKS_R2_PRIMARY_API_TOKEN: ${{ secrets.PUNKS_R2_PRIMARY_API_TOKEN }}
          PUNKS_R2_PRIMARY_ACCESS_KEY_ID: ${{ secrets.PUNKS_R2_PRIMARY_ACCESS_KEY_ID }}
          PUNKS_R2_PRIMARY_SECRET_ACCESS_KEY: ${{ secrets.PUNKS_R2_PRIMARY_SECRET_ACCESS_KEY }}
          PUNKS_R2_RECOVERY_API_TOKEN: ${{ secrets.PUNKS_R2_RECOVERY_API_TOKEN }}
          PUNKS_R2_RECOVERY_ACCESS_KEY_ID: ${{ secrets.PUNKS_R2_RECOVERY_ACCESS_KEY_ID }}
          PUNKS_R2_RECOVERY_SECRET_ACCESS_KEY: ${{ secrets.PUNKS_R2_RECOVERY_SECRET_ACCESS_KEY }}
          PUNKS_R2_PRIMARY_DESTINATION: ${{ vars.PUNKS_R2_PRIMARY_DESTINATION }}
          PUNKS_R2_RECOVERY_DESTINATION: ${{ vars.PUNKS_R2_RECOVERY_DESTINATION }}
        run: |
          set -euo pipefail
          test -n "$PUNKS_OPERATIONAL_BUDGET_MANIFEST_SHA256"
          node scripts/candidate/operational-budget-fetch.mjs \
            --source-sha "$SOURCE_SHA" \
            --staging-deployment-id "$STAGING_DEPLOYMENT_ID" \
            --manifest-sha256 "$PUNKS_OPERATIONAL_BUDGET_MANIFEST_SHA256" \
            --candidate-root candidate \
            --r2-primaire "$PUNKS_R2_PRIMARY_DESTINATION" \
            --r2-secondaire "$PUNKS_R2_RECOVERY_DESTINATION" \
            --frontieres scripts/promotion-frontiers.mjs \
            --output candidate/operational-budget-observation.json \
            --exports-output candidate/operational-budget-exports

      - name: Attest the complete pre-dossier evidence
        id: attest_complete_evidence
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            candidate/release-assets/*
            candidate/aggregate-manifest.json
            candidate/staging-deployment-proof.json
            candidate/live-staging-auth-proof.json
            candidate/live-staging-follow-proof.json
            candidate/promotion-evidence/**/*
            candidate/operational-budget-observation.json
            candidate/operational-budget-r2-manifest.json
            candidate/operational-budget-provider.sigstore.json
            candidate/operational-budget-exports/*
            candidate/operational-budget-sources/*

      - name: Verify the complete pre-dossier evidence
        id: verify_complete_evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ATTESTATION_BUNDLE: ${{ steps.attest_complete_evidence.outputs.bundle-path }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pre-dossier-verification"
          while IFS= read -r -d '' subject; do
            output="$RUNNER_TEMP/pre-dossier-verification/$(printf '%s' "$subject" | sha256sum | cut -d ' ' -f 1).json"
            gh attestation verify "$subject" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "github.com/$GITHUB_REPOSITORY/.github/workflows/punks-desktop-candidate.yml" \
              --source-digest "$SOURCE_SHA" \
              --source-ref "$GITHUB_REF" \
              --deny-self-hosted-runners \
              --bundle "$ATTESTATION_BUNDLE" \
              --format json > "$output"
            test -s "$output"
          done < <(find candidate/release-assets candidate/promotion-evidence \
            candidate/operational-budget-exports candidate/operational-budget-sources \
            -type f -print0; printf '%s\0' candidate/aggregate-manifest.json candidate/staging-deployment-proof.json candidate/live-staging-auth-proof.json candidate/live-staging-follow-proof.json candidate/operational-budget-observation.json candidate/operational-budget-r2-manifest.json candidate/operational-budget-provider.sigstore.json)
          cp "$ATTESTATION_BUNDLE" candidate/promotion-evidence/pre-dossier-provenance.sigstore.json

      - name: Seal and publish authenticated operational budget sources
        id: seal_operational_budgets
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PUNKS_OPERATIONAL_BUDGET_MANIFEST_SHA256: ${{ needs.observe_operational.outputs.manifest_sha256 }}
          PUNKS_R2_PRIMARY_API_TOKEN: ${{ secrets.PUNKS_R2_PRIMARY_API_TOKEN }}
          PUNKS_R2_PRIMARY_ACCESS_KEY_ID: ${{ secrets.PUNKS_R2_PRIMARY_ACCESS_KEY_ID }}
          PUNKS_R2_PRIMARY_SECRET_ACCESS_KEY: ${{ secrets.PUNKS_R2_PRIMARY_SECRET_ACCESS_KEY }}
          PUNKS_R2_RECOVERY_API_TOKEN: ${{ secrets.PUNKS_R2_RECOVERY_API_TOKEN }}
          PUNKS_R2_RECOVERY_ACCESS_KEY_ID: ${{ secrets.PUNKS_R2_RECOVERY_ACCESS_KEY_ID }}
          PUNKS_R2_RECOVERY_SECRET_ACCESS_KEY: ${{ secrets.PUNKS_R2_RECOVERY_SECRET_ACCESS_KEY }}
          PUNKS_R2_PRIMARY_DESTINATION: ${{ vars.PUNKS_R2_PRIMARY_DESTINATION }}
          PUNKS_R2_RECOVERY_DESTINATION: ${{ vars.PUNKS_R2_RECOVERY_DESTINATION }}
        run: |
          set -euo pipefail
          test -s candidate/operational-budget-provider.sigstore.json
          node scripts/candidate/operational-budget-seal.mjs \
            --source-sha "$SOURCE_SHA" \
            --staging-deployment-id "$STAGING_DEPLOYMENT_ID" \
            --manifest-sha256 "$PUNKS_OPERATIONAL_BUDGET_MANIFEST_SHA256" \
            --candidate-root candidate \
            --bundle candidate/operational-budget-provider.sigstore.json \
            --r2-primaire "$PUNKS_R2_PRIMARY_DESTINATION" \
            --r2-secondaire "$PUNKS_R2_RECOVERY_DESTINATION" \
            --frontieres scripts/promotion-frontiers.mjs

      - name: Assemble the exact promotion dossier
        id: assemble_promotion_dossier
        shell: bash
        run: |
          set -euo pipefail
          node scripts/candidate/promotion-dossier.mjs \
            --racine-preuves candidate/promotion-evidence \
            --index-preuves candidate/promotion-evidence/index.json \
            --candidat-sha "$SOURCE_SHA" \
            --promotion-profile cloudflare/promotion-profiles.json \
            --staging-deployment-proof candidate/promotion-evidence/staging-deployment-proof.json \
            --provenance-bundle candidate/promotion-evidence/pre-dossier-provenance.sigstore.json \
            --repository "$GITHUB_REPOSITORY" \
            --source-ref "$GITHUB_REF" \
            --signer-workflow "github.com/$GITHUB_REPOSITORY/.github/workflows/punks-desktop-candidate.yml" \
            --sortie candidate/promotion-dossier.json

      - name: Validate the promotion dossier and emit its local pair
        id: validate_promotion_dossier
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' candidate/ candidate-input/ >> .git/info/exclude
          pnpm promotion:valider -- \
            candidate/promotion-dossier.json \
            --sortie candidate/promotion

      - name: Upload unattested aggregate for final attestation
        id: upload_aggregate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: punks-candidate-aggregate-unattested-${{ inputs.source_sha }}
          path: candidate
          if-no-files-found: error
          retention-days: 1

  attest_candidate:
    name: Attest, verify and stage one atomic candidate
    needs: aggregate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      artifact-metadata: write
      contents: write
      attestations: write
      id-token: write
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
    steps:
      - name: Download the exact four-leg aggregate
        id: download_aggregate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: punks-candidate-aggregate-unattested-${{ inputs.source_sha }}
          path: candidate

      - name: Attest aggregate candidate provenance
        id: attest_candidate
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: candidate/**/*

      - name: Verify aggregate attestation and source identity
        id: verify_candidate_attestation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ATTESTATION_BUNDLE: ${{ steps.attest_candidate.outputs.bundle-path }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/candidate-verification"
          while IFS= read -r -d '' artifact; do
            output="$RUNNER_TEMP/candidate-verification/$(printf '%s' "$artifact" | sha256sum | cut -d ' ' -f 1).json"
            gh attestation verify "$artifact" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "github.com/$GITHUB_REPOSITORY/.github/workflows/punks-desktop-candidate.yml" \
              --source-digest "$SOURCE_SHA" \
              --source-ref "$GITHUB_REF" \
              --deny-self-hosted-runners \
              --bundle "$ATTESTATION_BUNDLE" \
              --format json > "$output"
            test -s "$output"
          done < <(find candidate -type f -print0 | sort -z)
          cp "$ATTESTATION_BUNDLE" candidate/punks-candidate-aggregate.sigstore.json
          printf '%s\n' "${{ steps.attest_candidate.outputs.attestation-url }}" > candidate/punks-candidate-attestation-url.txt

      - name: Stage or repair the immutable draft after attestation
        id: stage_immutable_draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RELEASE_TAG="punks-staging-${SOURCE_SHA}"
          release_json="$RUNNER_TEMP/existing-release.json"
          if gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json isDraft,isPrerelease,tagName,targetCommitish,assets \
            > "$release_json" 2>/dev/null; then
            jq -e --arg tag "$RELEASE_TAG" --arg sha "$SOURCE_SHA" '
              .isDraft == true and
              .isPrerelease == false and
              .tagName == $tag and
              .targetCommitish == $sha
            ' "$release_json" >/dev/null
          else
            tag_error="$RUNNER_TEMP/tag-error.txt"
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>"$tag_error"; then
              echo "Git tag already exists without a repairable draft: $RELEASE_TAG" >&2
              exit 1
            fi
            grep -F "HTTP 404" "$tag_error" >/dev/null
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$SOURCE_SHA" \
              --title "Punks staging candidate ${SOURCE_SHA}" \
              --notes "Signed and attested Punks staging candidate bound to source ${SOURCE_SHA}. It remains a draft until the complete promotion dossier and tranche receipt are published." \
              --draft
          fi
          shopt -s nullglob
          release_assets=(
            candidate/release-assets/*
            candidate/aggregate-manifest.json
            candidate/staging-deployment-proof.json
            candidate/live-staging-auth-proof.json
            candidate/live-staging-follow-proof.json
            candidate/punks-candidate-aggregate.sigstore.json
            candidate/punks-candidate-attestation-url.txt
          )
          test "${#release_assets[@]}" -gt 5
          gh release upload "$RELEASE_TAG" "${release_assets[@]}" \
            --clobber \
            --repo "$GITHUB_REPOSITORY"

      - name: Verify the repairable draft and exact asset set
        id: verify_staged_draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RELEASE_TAG="punks-staging-${SOURCE_SHA}"
          release_json="$RUNNER_TEMP/release.json"
          gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json isDraft,isPrerelease,tagName,targetCommitish,assets \
            > "$release_json"
          jq -e --arg tag "$RELEASE_TAG" --arg sha "$SOURCE_SHA" '
            .isDraft == true and
            .isPrerelease == false and
            .tagName == $tag and
            .targetCommitish == $sha
          ' "$release_json" >/dev/null
          expected_assets="$RUNNER_TEMP/expected-assets.txt"
          actual_assets="$RUNNER_TEMP/actual-assets.txt"
          find candidate/release-assets -maxdepth 1 -type f -exec basename {} \; \
            | LC_ALL=C sort > "$expected_assets"
          printf '%s\n' \
            punks-candidate-aggregate.sigstore.json \
            punks-candidate-attestation-url.txt \
            aggregate-manifest.json \
            staging-deployment-proof.json \
            live-staging-auth-proof.json \
            live-staging-follow-proof.json \
            >> "$expected_assets"
          LC_ALL=C sort -o "$expected_assets" "$expected_assets"
          jq -r '.assets[].name' "$release_json" | LC_ALL=C sort > "$actual_assets"
          diff -u "$expected_assets" "$actual_assets"

      - name: Upload the only final candidate
        id: upload_final_candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: punks-desktop-candidate-${{ inputs.source_sha }}
          path: candidate
          if-no-files-found: error
          retention-days: 30

  publish_promotion:
    name: Publish immutable T1 proofs and activate the verified candidate
    needs: attest_candidate
    if: inputs.validation_scope == 'full-candidate'
    environment: punks-staging-promotion
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      attestations: read
      contents: write
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      STAGING_DEPLOYMENT_ID: ${{ inputs.staging_deployment_id }}
      PUNKS_R2_PRIMARY_DESTINATION: ${{ vars.PUNKS_R2_PRIMARY_DESTINATION }}
      PUNKS_R2_RECOVERY_DESTINATION: ${{ vars.PUNKS_R2_RECOVERY_DESTINATION }}
    steps:
      - name: Checkout the immutable publisher source
        id: checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up pnpm for the immutable publisher
        id: setup_pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.4.0

      - name: Set up Node for the immutable publisher
        id: setup_node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.14.1
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install immutable publisher dependencies
        id: install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Download the final attested candidate
        id: download_final_candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: punks-desktop-candidate-${{ inputs.source_sha }}
          path: candidate

      - name: Publish the immutable attestation and Receipt
        id: publish_immutable_proofs
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PUNKS_R2_PRIMARY_API_TOKEN: ${{ secrets.PUNKS_R2_PRIMARY_API_TOKEN }}
          PUNKS_R2_PRIMARY_ACCESS_KEY_ID: ${{ secrets.PUNKS_R2_PRIMARY_ACCESS_KEY_ID }}
          PUNKS_R2_PRIMARY_SECRET_ACCESS_KEY: ${{ secrets.PUNKS_R2_PRIMARY_SECRET_ACCESS_KEY }}
          PUNKS_R2_RECOVERY_API_TOKEN: ${{ secrets.PUNKS_R2_RECOVERY_API_TOKEN }}
          PUNKS_R2_RECOVERY_ACCESS_KEY_ID: ${{ secrets.PUNKS_R2_RECOVERY_ACCESS_KEY_ID }}
          PUNKS_R2_RECOVERY_SECRET_ACCESS_KEY: ${{ secrets.PUNKS_R2_RECOVERY_SECRET_ACCESS_KEY }}
          PUNKS_RELEASE_APPROVERS_JSON: ${{ secrets.PUNKS_RELEASE_APPROVERS_JSON }}
          PUNKS_RELEASE_APPROVERS_ANCHOR_SHA256: ${{ secrets.PUNKS_RELEASE_APPROVERS_ANCHOR_SHA256 }}
          PUNKS_R2_DESTINATIONS_ANCHOR_SHA256: ${{ secrets.PUNKS_R2_DESTINATIONS_ANCHOR_SHA256 }}
        run: |
          set -euo pipefail
          test -f candidate/promotion-dossier.json
          test -f candidate/promotion/attestation-tranche-1.json
          test -f candidate/promotion/recu-promotion-1.json
          test -n "$PUNKS_R2_PRIMARY_DESTINATION"
          test -n "$PUNKS_R2_RECOVERY_DESTINATION"
          node scripts/promotion-publish.mjs \
            --graphe docs/migration/release-graph.yaml \
            --dossier candidate/promotion-dossier.json \
            --attestation candidate/promotion/attestation-tranche-1.json \
            --recu candidate/promotion/recu-promotion-1.json \
            --depot "$GITHUB_REPOSITORY" \
            --tag "punks-staging-${SOURCE_SHA}" \
            --canal punks-desktop \
            --r2-primaire "$PUNKS_R2_PRIMARY_DESTINATION" \
            --r2-secondaire "$PUNKS_R2_RECOVERY_DESTINATION" \
            --bootstrap-r2 \
            --frontieres scripts/promotion-frontiers.mjs \
            > "$RUNNER_TEMP/promotion-publication.json"
          jq -e '.statut == "publiee" or .statut == "reprise" or .statut == "deja-publiee"' \
            "$RUNNER_TEMP/promotion-publication.json" >/dev/null

      - name: Observe the exact current GitHub Actions cadence
        id: observe_github_cadence
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.PUNKS_CLOUDFLARE_API_TOKEN }}
          PUNKS_COMPATIBILITY_GENERATION: ${{ vars.PUNKS_COMPATIBILITY_GENERATION }}
          PUNKS_OPERATOR_PROVISIONING_GENERATION: ${{ vars.PUNKS_OPERATOR_PROVISIONING_GENERATION }}
          PUNKS_PROMOTION_SESSION_GENERATION: ${{ vars.PUNKS_PROMOTION_SESSION_GENERATION }}
          PUNKS_RELEASE_APPROVERS_GENERATION: ${{ vars.PUNKS_RELEASE_APPROVERS_GENERATION }}
          PUNKS_R2_PRIMARY_GENERATION: ${{ vars.PUNKS_R2_PRIMARY_GENERATION }}
          PUNKS_R2_RECOVERY_GENERATION: ${{ vars.PUNKS_R2_RECOVERY_GENERATION }}
          PUNKS_ATTESTATION_PRIMARY_GENERATION: ${{ vars.PUNKS_ATTESTATION_PRIMARY_GENERATION }}
          PUNKS_ATTESTATION_SECONDARY_GENERATION: ${{ vars.PUNKS_ATTESTATION_SECONDARY_GENERATION }}
          PUNKS_SESSION_RECOVERY_GENERATION: ${{ vars.PUNKS_SESSION_RECOVERY_GENERATION }}
        run: |
          set -euo pipefail
          budget_file="candidate/operational-budget-observation.json"
          budget_exports="candidate/operational-budget-exports"
          security_generations="$RUNNER_TEMP/punks-security-generations.json"
          cleanup_topology_input() {
            rm -f "$RUNNER_TEMP/punks-security-generations.json"
          }
          trap cleanup_topology_input EXIT
          test -n "$CLOUDFLARE_API_TOKEN"
          test -f "$budget_file"
          test -d "$budget_exports"
          test -d candidate/operational-budget-sources
          test -s candidate/operational-budget-provenance.json
          node --input-type=module - "$security_generations" <<'NODE'
          import { writeFileSync } from "node:fs";
          const names = {
            compatibility: "PUNKS_COMPATIBILITY_GENERATION",
            operatorProvisioning: "PUNKS_OPERATOR_PROVISIONING_GENERATION",
            promotionSession: "PUNKS_PROMOTION_SESSION_GENERATION",
            releaseApprovers: "PUNKS_RELEASE_APPROVERS_GENERATION",
            r2Primary: "PUNKS_R2_PRIMARY_GENERATION",
            r2Recovery: "PUNKS_R2_RECOVERY_GENERATION",
            attestationPrimary: "PUNKS_ATTESTATION_PRIMARY_GENERATION",
            attestationSecondary: "PUNKS_ATTESTATION_SECONDARY_GENERATION",
            sessionRecovery: "PUNKS_SESSION_RECOVERY_GENERATION",
          };
          const generations = Object.fromEntries(
            Object.entries(names).map(([name, variable]) => {
              const value = Number(process.env[variable]);
              if (!Number.isSafeInteger(value) || value < 1) process.exit(1);
              return [name, value];
            }),
          );
          writeFileSync(process.argv[2], `${JSON.stringify(generations)}\n`, {
            flag: "wx",
            mode: 0o600,
          });
          NODE
          node scripts/candidate/operational-topology-observation.mjs \
            --source-sha "$SOURCE_SHA" \
            --staging-deployment-id "$STAGING_DEPLOYMENT_ID" \
            --security-generations "$security_generations" \
            --output candidate/operational-topology-observation.json
          node scripts/candidate/github-cadence-observation.mjs \
            --dossier candidate/promotion-dossier.json \
            --publication-result "$RUNNER_TEMP/promotion-publication.json" \
            --budget-observation "$budget_file" \
            --budget-exports "$budget_exports" \
            --candidate-root candidate \
            --topology-observation candidate/operational-topology-observation.json \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --source-sha "$SOURCE_SHA" \
            --staging-deployment-id "$STAGING_DEPLOYMENT_ID" \
            --output candidate/github-cadence-observation.json
          rm -f "$security_generations"
          trap - EXIT

      - name: Materialize signed expansion and active execution heads
        id: materialize_operational_head
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PUNKS_R2_PRIMARY_API_TOKEN: ${{ secrets.PUNKS_R2_PRIMARY_API_TOKEN }}
          PUNKS_R2_PRIMARY_ACCESS_KEY_ID: ${{ secrets.PUNKS_R2_PRIMARY_ACCESS_KEY_ID }}
          PUNKS_R2_PRIMARY_SECRET_ACCESS_KEY: ${{ secrets.PUNKS_R2_PRIMARY_SECRET_ACCESS_KEY }}
          PUNKS_R2_RECOVERY_API_TOKEN: ${{ secrets.PUNKS_R2_RECOVERY_API_TOKEN }}
          PUNKS_R2_RECOVERY_ACCESS_KEY_ID: ${{ secrets.PUNKS_R2_RECOVERY_ACCESS_KEY_ID }}
          PUNKS_R2_RECOVERY_SECRET_ACCESS_KEY: ${{ secrets.PUNKS_R2_RECOVERY_SECRET_ACCESS_KEY }}
          PUNKS_RELEASE_APPROVERS_JSON: ${{ secrets.PUNKS_RELEASE_APPROVERS_JSON }}
          PUNKS_RELEASE_APPROVERS_ANCHOR_SHA256: ${{ secrets.PUNKS_RELEASE_APPROVERS_ANCHOR_SHA256 }}
          PUNKS_R2_DESTINATIONS_ANCHOR_SHA256: ${{ secrets.PUNKS_R2_DESTINATIONS_ANCHOR_SHA256 }}
        run: |
          set -euo pipefail
          node scripts/candidate/operational-release-head.mjs \
            --dossier candidate/promotion-dossier.json \
            --publication-result "$RUNNER_TEMP/promotion-publication.json" \
            --cadence-observation candidate/github-cadence-observation.json \
            --budget-exports candidate/operational-budget-exports \
            --candidate-root candidate \
            --depot "$GITHUB_REPOSITORY" \
            --tag "punks-staging-${SOURCE_SHA}" \
            --r2-primaire "$PUNKS_R2_PRIMARY_DESTINATION" \
            --r2-secondaire "$PUNKS_R2_RECOVERY_DESTINATION" \
            --frontieres scripts/promotion-frontiers.mjs \
            --output candidate/operational-release-head.json
          node --input-type=module - "$SOURCE_SHA" "$STAGING_DEPLOYMENT_ID" <<'NODE'
          import { readFileSync } from "node:fs";
          import { canonicalSha256 } from "./scripts/migration-manifest-lib.mjs";
          import { validateOperationalReleaseHead } from "./scripts/candidate/operational-release-head.mjs";
          const dossier = JSON.parse(readFileSync("candidate/promotion-dossier.json", "utf8"));
          const head = JSON.parse(readFileSync("candidate/operational-release-head.json", "utf8"));
          validateOperationalReleaseHead(head, {
            sourceSha: process.argv[2],
            stagingDeploymentId: process.argv[3],
            dossierSha256: canonicalSha256(dossier),
          });
          NODE

      - name: Activate the exact verified draft
        id: activate_verified_draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -s candidate/operational-release-head.json
          jq -e --arg sha "$SOURCE_SHA" '
            .schema == "punks.operational-release-head.v1" and
            .state == "active" and
            .sourceSha == $sha and
            [.transitions[].programme] == ["expansion", "active"] and
            ([.transitions[].steps[].step] == ["E0", "E1", "E2", "E3", "E4", "A0", "A1", "A2", "A3", "A4"])
          ' candidate/operational-release-head.json >/dev/null
          release_tag="punks-staging-${SOURCE_SHA}"
          before="$RUNNER_TEMP/release-before.json"
          gh release view "$release_tag" \
            --repo "$GITHUB_REPOSITORY" \
            --json isDraft,isPrerelease,targetCommitish,tagName > "$before"
          jq -e --arg sha "$SOURCE_SHA" --arg tag "$release_tag" '
            .isDraft == true and
            .isPrerelease == false and
            .targetCommitish == $sha and
            .tagName == $tag
          ' "$before" >/dev/null
          gh release edit "$release_tag" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --latest
          gh release view "$release_tag" \
            --repo "$GITHUB_REPOSITORY" \
            --json isDraft,isPrerelease,targetCommitish,tagName \
            --jq ".isDraft == false and .isPrerelease == false and .targetCommitish == \"${SOURCE_SHA}\" and .tagName == \"${release_tag}\"" \
            | grep -Fx true >/dev/null
