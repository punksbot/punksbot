services:
  relay:
    ports: !reset []

  caddy:
    image: caddy:2-alpine
    depends_on:
      relay:
        condition: service_healthy
    environment:
      PUNKS_DOMAIN: ${PUNKS_DOMAIN:?set PUNKS_DOMAIN}
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - punks-caddy-data:/data
      - punks-caddy-config:/config
    restart: unless-stopped
    networks:
      - punks-net

volumes:
  punks-caddy-data:
    labels:
      com.punks.volume: caddy-data
  punks-caddy-config:
    labels:
      com.punks.volume: caddy-config
