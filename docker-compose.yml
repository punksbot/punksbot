name: punks

services:
  postgres:
    image: postgres:17-alpine
    container_name: punks-postgres
    environment:
      POSTGRES_USER: punks
      POSTGRES_PASSWORD: punks_dev
      POSTGRES_DB: punks
      PGDATA: /var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - punks-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U punks"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512m
    labels:
      com.punks.service: "postgres"
      com.punks.env: "dev"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: punks-redis
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - punks-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 128m
    labels:
      com.punks.service: "redis"
      com.punks.env: "dev"
    restart: unless-stopped

  adminer:
    image: adminer:latest
    container_name: punks-adminer
    ports:
      - "127.0.0.1:8082:8080"
    networks:
      - punks-net
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    deploy:
      resources:
        limits:
          memory: 64m
    labels:
      com.punks.service: "adminer"
      com.punks.env: "dev"
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: punks-keycloak
    command: start-dev --http-port=8080
    environment:
      KC_DB: dev-mem
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "127.0.0.1:8180:8080"
    networks:
      - punks-net
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512m
    labels:
      com.punks.service: "keycloak"
      com.punks.env: "dev"
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: punks-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: punks_dev
      MINIO_ROOT_PASSWORD: punks_dev_secret
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    networks:
      - punks-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256m
    labels:
      com.punks.service: "minio"
      com.punks.env: "dev"
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    container_name: punks-minio-init
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - punks-net
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 punks_dev punks_dev_secret &&
        mc mb --ignore-existing local/punks-media &&
        mc anonymous set none local/punks-media
      "
    labels:
      com.punks.service: "minio-init"
      com.punks.env: "dev"
    restart: "no"

  prometheus:
    image: prom/prometheus:latest
    container_name: punks-prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - punks-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          memory: 128m
    labels:
      com.punks.service: "prometheus"
      com.punks.env: "dev"
    restart: unless-stopped

volumes:
  postgres-data:
    name: punks-postgres-data
    labels:
      com.punks.volume: "postgres"
  minio-data:
    name: punks-minio-data
    labels:
      com.punks.volume: "minio"
  prometheus-data:
    name: punks-prometheus-data
    labels:
      com.punks.volume: "prometheus"

networks:
  punks-net:
    name: punks-net
    driver: bridge
    labels:
      com.punks.network: "dev"
