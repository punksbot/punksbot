# Inventaire de retrait Buzz → Punks — manifeste canonique
# Parent : issue #47 ; création exigée par l’issue #49.
# Source de décision : issues #13 (preuves/seuils), #14 (ordre des tranches), #17 (présente décision).
# Checkpoint de récupération : 50e16de180dda4365f8001a8a73503f16977a175.
# Baseline Buzz gelée : da818eddc2f470c006a1073c8c5452f8a989f272.
#
# Règles (décidées en #17) :
#   - La ligne d’inventaire est le module (fichier ou répertoire, globs de famille admis).
#   - Chaque actif porte exactement UN verdict ; « separation » précise la frontière de
#     scission d’un module partagé (quelles parties meurent à quelle tranche).
#   - Verdicts de tranche (tranche:1..31) : retiré physiquement par le candidat accepté
#     de cette tranche. « scellement » : retiré par le gate terminal desktop (après la
#     tranche 31). « retrait-global » : retiré par l’entrée terminale serveur.
#   - Verdicts de conservation typés : atelier, ui-neutre, mecanisme-test, golden-neutre,
#     actif-punks, outillage, attente-refonte-ui.
#   - Un module partagé a pour propriétaire la tranche de son DERNIER consommateur ;
#     les parties antérieures disparaissent plus tôt via « separation ».
#   - Cette vue YAML est canonique ; withdrawal-inventory.md en est dérivée
#     (générateur : scripts/render-withdrawal-inventory.mjs).
#   - Syntaxe des chemins : base réelle (répertoires avec « / » final), ensembles
#     « {a,b} », joker « * » par segment ; un qualificatif entre parenthèses après la
#     base désigne une partie d’un fichier (cibles, blocs, arêtes).
#   - Validation : node scripts/check-migration-manifests.mjs — refuse doublons,
#     omissions (tout fichier suivi doit être couvert), références invalides et
#     verdicts incomplets ; protège aussi les actifs Punks desktop contre un
#     propriétaire legacy et les frontières terminales du format ; --hashes
#     émet le SHA-256 canonique cité par les attestations.

version: 1
checkpoint-recuperation: 50e16de180dda4365f8001a8a73503f16977a175
baseline-buzz: da818eddc2f470c006a1073c8c5452f8a989f272

clients-requis: [desktop, web, mobile, admin-web]

critere-retrait-global: >
  L’entrée « Retrait global du serveur historique » s’ouvre uniquement lorsque :
  (1) les 31 tranches desktop sont scellées ; (2) chaque client requis — desktop, web,
  mobile, admin-web — possède un verdict explicite (migré par un effort décidé ailleurs,
  ou retiré) ; (3) le gate négatif prouve qu’aucun graphe produit, outil actif ni
  artefact n’atteint le relay, son identité Nostr publique ou ses dépendances serveur.
  Elle ne crée aucune disponibilité.

allowlist-nostr:
  - envelope: Journal interne Punks
    portee: backend cloudflare/ uniquement, jamais un actif client
  - envelope: Attestation Punks
    portee: backend cloudflare/ uniquement, jamais un actif client

goldens:
  foyer: goldens/
  registre: docs/migration/goldens-ledger.yaml
  univers: docs/migration/goldens-universe.yaml
  univers-tests: docs/migration/buzz-tests-universe.yaml
  politique: >
    Clé par invariant, jamais par fichier source ; exécution sans relay, Docker,
    PostgreSQL, Redis ni autre runtime serveur historique ; chaque test Buzz retiré
    obtient exactement une ligne (preuve Punks, différence intentionnelle, capacité
    indisponible, hors périmètre). Le registre est rempli tranche par tranche ; le
    foyer matérialise les goldens déplacés lors de ces retraits.

