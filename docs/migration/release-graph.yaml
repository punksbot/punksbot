# Graphe de release Punks — source canonique
# Parent : issue #47 (spec de programme) ; création exigée par l’issue #51.
# Décisions : #13 (preuves/seuils), #14 (ordre des tranches), #16 (promotion/
# observation/récupération), #17 (inventaire de retrait).
# ADR : docs/adr/0060-graphe-de-release-expansion-activation-contraction.md
# Checkpoint de récupération : 50e16de180dda4365f8001a8a73503f16977a175.
# Baseline Buzz gelée : da818eddc2f470c006a1073c8c5452f8a989f272.
#
# Règles :
#   - Un nœud logique par tranche, cycle de vie fermé
#     preparation → expansion → active → contraction → contractee. Expansion,
#     activation et contraction restent des releases distinctes : chaque entrée
#     du journal append-only porte un instant exact, un release-id, un
#     déploiement, un instantané complet content-addressé du candidat et une
#     attestation uniques, ainsi que son Reçu signé. Le Reçu contient le digest
#     du graphe et l'état opérationnel minimal fermé de la décision #16.
#     `contractee` est l'état terminal de la contraction, pas une quatrième
#     release.
#     Les nœuds tranche:1…N restent contigus et ordonnés ; aucun historique ne
#     peut être omis ni rester en préparation lorsque le graphe avance.
#   - Un candidat ne quitte « preparation » que si les preuves obligatoires ET
#     le retrait associé (lignes du registre des goldens + verdicts exécutés du
#     manifeste de retrait) sont rattachés au MÊME SHA : l’activation est
#     structurellement impossible sans ce dossier indivisible.
#   - N et N−1 restent supportés au moins 90 jours après l’activation de N ;
#     la contraction de N−1 exige ensuite moins de 1 % d’usage pendant 14 jours
#     consécutifs.
#   - Deux releases actives sont admises uniquement pour N/N−1 consécutifs.
#     Les profils desktop ont une chronologie d'acceptation indépendante de
#     l'éligibilité backend ; une contraction ne ferme jamais un profil et
#     chaque activation historique reste couverte par un intervalle.
#   - Le roll-forward corrige la tranche logique courante sans consommer la
#     tranche fonctionnelle suivante : nouveau SHA, nouveau release-id,
#     instantanés complets distincts et redémarrage E0. Il ne peut réutiliser ni
#     un checkpoint Buzz ni un SHA Punks historique. Un retour à une version
#     Punks antérieure exige les treize contrôles recalculés à l'instant UTC
#     exact, une cible déjà activée et un nouveau Reçu signé ; aucun retour vers
#     Buzz n’existe.
#   - Attestations et Reçus sont immuables : écriture create-only,
#     verrouillage d’objet, deux comptes R2, publication avec la release ET
#     dans le stockage R2 prévu. Les signatures Ed25519 sont vérifiées contre
#     le registre de clés approuvées et un Reçu de promotion lie toujours le
#     hash canonique de l'attestation finale.
#   - Le candidat en preparation porte les hashes vivants recalculés par le
#     gate (`node scripts/check-release-graph.mjs`) ; une release scellée fige
#     les siens. Hash canonique du document : `--hashes`.
#   - Les lignes retraits-par-tranche peuvent préparer le candidat source tant
#     qu'il reste en « preparation » ; elles ne valent ni preuve de retrait ni
#     scellement. Dès qu'une tranche quitte « preparation », son objet retrait
#     doit lier ces lignes et le diff au même SHA, et tout actif tranche:N doit
#     être physiquement absent.

version: 1
checkpoint-recuperation: 50e16de180dda4365f8001a8a73503f16977a175
baseline-buzz: da818eddc2f470c006a1073c8c5452f8a989f272

canal: punks-desktop

references:
  spec: 47
  decisions: [13, 14, 16, 17]
  adr:
    - docs/adr/0060-graphe-de-release-expansion-activation-contraction.md

politique:
  fenetre-support-jours: 90
  seuil-usage-contraction: 1
  fenetre-mesure-contraction-jours: 14
  recuperation:
    normale: roll-forward
    retour-punks-anterieur: certificat-compatibilite-exige
    retour-buzz: interdit
  rpo-logique-nul: true
  immuabilite:
    bootstrap-r2:
      premiere-activation: github-puis-r2
      reference: bootstrap-github-attestation-sha256
    attestations:
      publication: [release, r2]
      ecriture: create-only
      verrouillage-objet: compliance
      comptes-r2: 2
    recus:
      publication: [release, r2]
      ecriture: create-only
      verrouillage-objet: compliance
      comptes-r2: 2

etats: [preparation, expansion, active, contraction, contractee]

transitions:
  - {de: preparation, vers: expansion}
  - {de: expansion, vers: active}
  - {de: active, vers: contraction}
  - {de: contraction, vers: contractee}

preuves-obligatoires:
  - corpus-conformite
  - suites-workers
  - cloudflare-check
  - playwright-facade
  - tauri-staging
  - accessibilite
  - fautes-injectees
  - retrait-diff
  - goldens-verdict
  - scans-negatifs

# Vocabulaire fermé des treize contrôles de l'issue #16. Chaque entrée d'un
# certificat de retour Punks embarque sa preuve verte et son sha256 canonique.
# Le Reçu signe le noyau du certificat et les douze premières preuves ; le
# treizième contrôle est lié au sha256 du nouveau Reçu d'éligibilité.
controles-certificat-retour-punks:
  - bundle-manifeste-originaux
  - attestation-valide-non-revoquee
  - securite-isolation-effacement-sans-buzz
  - profils-desktop-actifs
  - versions-etat-durable-objects
  - migrations-durable-objects-franchissables
  - migrations-d1-expand-compatibles
  - formats-r2-tombstones-generations
  - topologie-cloudflare
  - generations-secrets-attestation-sessions
  - workflows-compatibles-ou-neutralises
  - smoke-handshake-probes
  - recu-cloudflare-digests-approbateurs

plateformes: [macos-arm64, macos-x64, linux-x64, windows-x64]

publication:
  r2:
    # À remplir avec deux comptes Cloudflare distincts avant le premier
    # scellement. Le gate refuse toute release scellée tant que cette liste est
    # vide, et le publisher compare ensuite les destinations octet pour octet.
    destinations: []
    layout:
      attestations: releases/{canal}/{id}/attestations/{attestation-sha256}.json
      recus: releases/{canal}/{id}/recus/{recu-sha256}.json

# Registre append-only des identités autorisées à approuver les Reçus. Une
# release scellée exige deux signatures Ed25519 valides dont les clés SPKI
# correspondent exactement à deux entrées distinctes de ce registre.
# Vide tant que le graphe ne contient qu'un candidat en préparation.
approbateurs-release: []

# Journal append-only des attestations supersédées ou révoquées. Chaque entrée
# lie l'attestation originale, son éventuelle remplaçante et un Reçu signé ;
# une révocation critique lie aussi le blocage de profil et le fencing.
invalidations-attestations: []

# Le candidat de la première tranche est relié aux matériaux réels du dépôt.
# Il ne porte ni SHA, ni déploiement de staging, ni artefact, ni preuve :
# aucun dossier de preuve n’est encore exécuté, la tranche reste
# structurellement non promouvable (voir docs/migration/tranche-01-preparation.md).
releases:
  - id: tranche:1
    tranche: 1
    etat: preparation
    sha: null
    materiaux:
      registre-contrats:
        version: 1
        sha256: 0f28ebff100277ea7c1f87fe12c97df3872a6af629d739077f8b7e51f2a84df8
      schemas:
        version: 1
        sha256: 83ec61cc8ab7c07fdb07a089878d6ac6fe0549ffc067df4a3a25c63a67171083
      generes:
        version: 1
        sha256: 846bb6bc8e4ed51c00a1e0a107ce101277f4a4a64d04203785d9d36df9010ff5
      profil:
        id: desktop-social-loop@1
        version: 1
        sha256: 4024e9ad9883df026d13054a1f3e82899ab2ec17adc2e909bf743e467ce6131e
      registre-goldens:
        version: 1
        sha256: e317ab42ffa0c0aaea7bc7b6ebe5d8ede446a4f0cc9738ed750c96f73d75e483
      manifeste-retrait:
        version: 1
        sha256: 498f8594838cb7587e6a6f8aecf400350080707263508e25a6240a186e0ccb3c
    staging:
      environnement: staging
      compte: 3a391620584c792dbbd8cfa148d7634a
      zone: b91146ce242a275de0b7e6e0cc3804c7
      materiau: cloudflare/staging.resources.json
      materiau-sha256: 990c4ed698a9322de6fdefdc1870a3c0d67889abb86a1504eb85d51c55fb7f20
      deploiement: null
    artefacts: []
    digests-production: null
    dossier-preuve-sha256: null
    preuves: {}
    retrait: null
    attestation: null
    attestation-sha256: null
    recus: []
    journal: []

# Tentatives promotionnelles scellées avant E0 et leurs événements signés.
# Une cadence complète rejoint le journal de la release ; les préfixes, pauses,
# échecs et quarantaines restent ici de façon append-only et récupérable.
executions: []

# Chronologie client indépendante. Chaque intervalle scellé contient id,
# version, sha256, accepte-depuis et accepte-jusqua (instant UTC ou null).
# Vide tant qu'aucune release backend n'est active.
profils-supportes: []

# Récupérations journalisées. Un roll-forward cite `depuis` et `cible` sur la
# même tranche logique, deux snapshots `{contenu, sha256}`, un nouveau
# release-id, un nouveau SHA candidat, son Reçu signé et `redemarrage: E0`.
# Un retour Punks cite un `instant` UTC canonique, un certificat recalculé à ce
# même instant, les treize preuves embarquées/content-addressées et son nouveau
# Reçu content-addressé signé par deux approbateurs approuvés.
# Vide tant qu’aucune release n’est scellée : il n’existe rien à récupérer.
recuperations: []
